<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Trex Mining - Home</title>

  <!-- One-time Starting Intro Check (Runs Only Once Per Session) -->
  <script>
    (function () {
      try {
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var hasIntroFlag = search.indexOf('intro=1') !== -1;

        if (hasIntroFlag) {
          sessionStorage.setItem('trex_intro_shown', '1');
          var cleaned = search.replace(/([?&])intro=1(&|$)/, function (_, p1, p2) {
            return p1 === '?' && p2 === '&' ? '?' : (p2 === '&' ? p1 : '');
          });
          if (cleaned === '?') cleaned = '';
          if (window.history && window.history.replaceState) {
            window.history.replaceState(null, '', window.location.pathname + cleaned + hash);
          }
          return;
        }

        if (!sessionStorage.getItem('trex_intro_shown')) {
          sessionStorage.setItem('trex_intro_shown', '1');
          window.location.replace('starting.html' + search + hash);
        }
      } catch (e) {}
    })();
  </script>

  <!-- Fast Page Prefetching -->
  <link rel="prefetch" href="Profile/profile.html">
  <link rel="prefetch" href="pages/Task.html">
  <link rel="prefetch" href="Games/Games.html">
  <link rel="prefetch" href="Post/feed.html">
  <link rel="prefetch" href="pages/Tap.html">

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=JetBrains+Mono:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    /* Full Dark Black Reset */
    html, body {
      background-color: #000000 !important;
      color: #ffffff;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 800;
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    ::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    body {
      display: flex;
      justify-content: center;
      background: #000000;
    }

    /* Screen Wrapper */
    .app-screen {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #000000;
      padding: 16px 18px 110px 18px;
      position: relative;
      overflow-x: hidden;
      gap: 18px;
    }

    /* ==========================================
       1. HEADER (Profile + Bold Refresh + Notification)
       ========================================== */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 2px;
    }

    .user-profile-left {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .profile-avatar-wrap {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #08080a;
      border: 2px solid #22222a;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-text-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .user-greeting {
      font-size: 16px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .user-date-sub {
      font-size: 11.5px;
      font-weight: 800;
      color: #7e7e8a;
      font-family: 'JetBrains Mono', monospace;
    }

    .hdr-actions-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Header Dark Action Buttons (Bold Refresh & Bell) */
    .hdr-action-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #070709;
      border: 1.5px solid #1e1e26;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.7);
      transition: transform 0.15s, background 0.2s, border-color 0.2s;
    }

    .hdr-action-btn:active {
      transform: scale(0.92);
      background: #111116;
      border-color: #32323e;
    }

    .hdr-action-btn svg {
      width: 20px;
      height: 20px;
      stroke: #ffffff;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .hdr-action-btn.refresh-icon-btn svg {
      width: 21px;
      height: 21px;
    }

    .hdr-action-btn.spinning svg {
      transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform: rotate(360deg);
    }

    /* Notification White Dot */
    .notif-dot {
      position: absolute;
      top: 9px;
      right: 10px;
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      background: #ffffff;
      border: 1.5px solid #000000;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
    }

    /* ==========================================
       2. CLEAN DARK WALLET SECTION
       ========================================== */
    .wallet-redesign-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    /* Top Balance Header */
    .wallet-top-balance {
      display: flex;
      flex-direction: column;
      padding: 6px 2px 2px 2px;
    }

    .wallet-balance-lbl {
      font-size: 13px;
      font-weight: 800;
      color: #8c8c98;
      letter-spacing: 0.2px;
      margin-bottom: 6px;
    }

    .wallet-balance-num-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .wallet-balance-num {
      font-size: 36px;
      font-weight: 900;
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: -0.8px;
      line-height: 1;
    }

    .wallet-assets-safe {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 800;
      color: #7c7c88;
    }

    .wallet-assets-safe svg {
      width: 14px;
      height: 14px;
      stroke: #7c7c88;
      stroke-width: 2.4;
      fill: none;
    }

    /* Eye Toggle Button (Dark & Bold) */
    .wallet-eye-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #070709;
      border: 1.5px solid #1e1e26;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.6);
      transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
      flex-shrink: 0;
      outline: none;
      padding: 0;
    }

    .wallet-eye-btn:active {
      transform: scale(0.90);
      background: #111116;
      border-color: #32323e;
    }

    .wallet-eye-btn svg {
      width: 16px;
      height: 16px;
      stroke: #d4d4dc;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      display: block;
      transition: stroke 0.2s ease;
    }

    .wallet-eye-btn:hover svg {
      stroke: #ffffff;
    }

    /* 4 Quick Action Buttons Row - Pure Dark & Bold */
    .wallet-actions-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
    }

    .wallet-act-btn {
      background: #060608;
      border: 1.5px solid #1b1b22;
      border-radius: 18px;
      padding: 14px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      cursor: pointer;
      color: #ffffff;
      min-height: 80px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.7);
      transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .wallet-act-btn:active {
      transform: scale(0.94);
      background: #101015;
      border-color: #2f2f3b;
    }

    .wallet-act-btn svg {
      width: 21px;
      height: 21px;
      stroke: #ffffff;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    .wallet-act-label {
      font-size: 11px;
      font-weight: 900;
      color: #ffffff;
      text-align: center;
      line-height: 1.2;
      letter-spacing: -0.1px;
    }

    @media (max-width: 380px) {
      .wallet-act-label {
        font-size: 10px;
      }
    }

    /* ==========================================
       3. TWO DARK & BOLD PROGRESS CARDS (TASK & REFFER)
       ========================================== */
    .status-cards-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .stat-pill-btn {
      background: #060608;
      border: 1.5px solid #1b1b22;
      border-radius: 20px;
      padding: 15px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.7);
      transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
      text-align: left;
    }

    .stat-pill-btn:active {
      transform: scale(0.96);
      background: #101015;
      border-color: #2f2f3b;
    }

    .stat-card-top-title {
      font-size: 15px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.2px;
    }

    .stat-card-bottom-row {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .stat-ring-box {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stat-ring-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      overflow: visible;
    }

    .ring-bg {
      stroke: #14141a;
      stroke-width: 6;
      fill: none;
    }

    .ring-fill {
      stroke-width: 6;
      stroke-linecap: round;
      fill: none;
      transition: stroke-dashoffset 0.8s ease;
    }

    .ring-fill-red {
      stroke: #ff1f1f;
      filter: drop-shadow(0 0 6px rgba(255, 31, 31, 0.8));
    }

    .ring-fill-green {
      stroke: #22c55e;
      filter: drop-shadow(0 0 6px rgba(34, 197, 94, 0.8));
    }

    .stat-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .stat-val-text {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: -0.4px;
      line-height: 1.1;
      display: flex;
      align-items: baseline;
      gap: 2px;
    }

    .stat-val-text.red { color: #ffffff; }
    .stat-val-text.red .stat-unit { color: #ff3333; font-size: 13px; font-weight: 900; }
    .stat-val-text.green { color: #ffffff; }
    .stat-val-text.green .stat-unit { color: #22c55e; font-size: 13px; font-weight: 900; }

    .stat-sub-label {
      font-size: 11.5px;
      font-weight: 800;
      color: #888894;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ==========================================
       4. WALLETS CATEGORY (ONE ROW / HORIZONTAL SCROLL)
       ========================================== */
    .wallets-category-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin-top: 2px;
    }

    .wallets-category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .wallets-category-title {
      font-size: 13.5px;
      font-weight: 900;
      color: #9ea0ad;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .wallets-category-badge {
      font-size: 10px;
      font-weight: 900;
      color: #22c55e;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 2px 7px;
      border-radius: 10px;
    }

    .wallets-scroll-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      overflow-x: auto;
      padding: 6px 2px 10px 2px;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .wallet-link-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-width: 64px;
      max-width: 70px;
      text-decoration: none;
      color: #ffffff;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }

    .wallet-link-item:active { transform: scale(0.90); }

    .wallet-logo-box {
      width: 56px;
      height: 56px;
      border-radius: 17px;
      background: #08080a;
      border: 1.5px solid #1b1b22;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.7);
      padding: 0;
      overflow: hidden;
      position: relative;
      transition: border-color 0.2s, background 0.2s;
    }

    .wallet-link-item:hover .wallet-logo-box {
      border-color: rgba(255, 255, 255, 0.35);
      background: #111116;
    }

    .wallet-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 16px;
      display: block;
    }

    .wallet-name-label {
      font-size: 11px;
      font-weight: 800;
      color: #d1d1de;
      text-align: center;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* ==========================================
       5. BOTTOM NAVIGATION BAR
       ========================================== */
    .bottom-nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 74px;
      background: #000000;
      border-top: 1px solid #1c1c1c;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 8px;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: none;
      border: none;
      color: #777777;
      cursor: pointer;
      width: 64px;
      padding: 6px 0;
      position: relative;
      transition: color 0.15s, transform 0.15s;
    }

    .nav-item:active { transform: scale(0.92); }

    .nav-icon-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
    }

    .nav-item svg {
      width: 26px;
      height: 26px;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: all 0.2s ease;
    }

    .nav-item span {
      font-size: 11px;
      font-weight: 900;
      color: inherit;
      letter-spacing: -0.1px;
    }

    .nav-item.active { color: #ffffff; }

    /* Toast Notification */
    .toast-pill {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(14, 14, 18, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 900;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.9);
      opacity: 0;
      pointer-events: none;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 200;
      white-space: nowrap;
    }

    .toast-pill.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="app-screen">

    <!-- 1. HEADER -->
    <div class="app-header">
      <div class="user-profile-left" onclick="selectTab('profile')">
        <div class="profile-avatar-wrap">
          <img id="userAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23666'%3E%3Ccircle cx='12' cy='8' r='4'/%3E%3Cpath d='M12 14c-4.42 0-8 1.79-8 4v2h16v-2c0-2.21-3.58-4-8-4z'/%3E%3C/svg%3E" alt="Profile">
        </div>
        <div class="user-text-meta">
          <span class="user-greeting" id="userName">@TelegramUser</span>
          <span class="user-date-sub" id="userId">ID: #00000000</span>
        </div>
      </div>

      <div class="hdr-actions-right">
        <!-- Bold Refresh Button (Exact Image Icon) -->
        <button class="hdr-action-btn refresh-icon-btn" id="refreshBtn" onclick="triggerRefresh()" title="Refresh Balance">
          <svg viewBox="0 0 24 24">
            <path d="M20.18 12.6 A 8.2 8.2 0 1 1 16.47 5.12" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="butt"/>
            <polygon points="17.85,1.95 19.69,7.20 14.15,7.65" fill="currentColor" stroke="none"/>
          </svg>
        </button>

        <!-- Notification Bell (White Dot) -->
        <button class="hdr-action-btn" onclick="openNotifications()" title="Notifications">
          <svg viewBox="0 0 24 24">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="notif-dot"></span>
        </button>
      </div>
    </div>

    <!-- 2. CLEAN DARK WALLET SECTION -->
    <div class="wallet-redesign-section">
      <!-- Top Balance Block -->
      <div class="wallet-top-balance">
        <div class="wallet-balance-lbl">Total Balance</div>
        <div class="wallet-balance-num-row">
          <div class="wallet-balance-num" id="homeBalance">0 TRX</div>
          <button class="wallet-eye-btn" id="toggleBalanceBtn" onclick="toggleBalanceVisibility(event)" title="Hide/Show Balance">
            <svg id="eyeOpenIcon" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg id="eyeCloseIcon" viewBox="0 0 24 24" style="display: none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <div class="wallet-assets-safe">
          <span>Your assets are safe</span>
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
        </div>
      </div>

      <!-- 4 Action Buttons: Withdraw, Withdraw History, Leaderboard, Tap & Earn -->
      <div class="wallet-actions-grid">
        <!-- 1. Withdraw -->
        <button type="button" class="wallet-act-btn" onclick="handleAction('withdraw')">
          <svg viewBox="0 0 24 24">
            <path d="M22 2L11 13"></path>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
          <span class="wallet-act-label">Withdraw</span>
        </button>

        <!-- 2. Withdraw History -->
        <button type="button" class="wallet-act-btn" onclick="handleAction('history')">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"></circle>
            <polyline points="12 7 12 12 15.5 14"></polyline>
          </svg>
          <span class="wallet-act-label">Withdraw<br>History</span>
        </button>

        <!-- 3. Leaderboard -->
        <button type="button" class="wallet-act-btn" onclick="handleAction('leaderboard')">
          <svg viewBox="0 0 24 24">
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
            <path d="M4 22h16"></path>
            <path d="M10 14.66V17c0 .55-.45 1-1 1H8v4h8v-4h-1c-.55 0-1-.45-1-1v-2.34c2.31-.69 4-2.82 4-5.32V4H6v5.34c0 2.5 1.69 4.63 4 5.32z"></path>
          </svg>
          <span class="wallet-act-label">Leaderboard</span>
        </button>

        <!-- 4. Tap and Earn (Opens pages/Tap.html) -->
        <button type="button" class="wallet-act-btn" onclick="handleAction('tap')">
          <svg viewBox="0 0 24 24">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
          <span class="wallet-act-label">Tap &amp; Earn</span>
        </button>
      </div>

      <!-- 3. TWO CARDS (TASK & REFFER) -->
      <div class="status-cards-row">
        <!-- Card 1: Task -->
        <div class="stat-pill-btn" onclick="selectTab('task')">
          <span class="stat-card-top-title">Task</span>
          <div class="stat-card-bottom-row">
            <div class="stat-ring-box">
              <svg class="stat-ring-svg" viewBox="0 0 44 44">
                <circle class="ring-bg" cx="22" cy="22" r="17"></circle>
                <circle class="ring-fill ring-fill-red" cx="22" cy="22" r="17" 
                        stroke-dasharray="106.8" 
                        stroke-dashoffset="105.7" id="taskRing">

  <div class="toast-pill" id="toastPill"></div>

  <script>
    let currentUserId = null;

    // Auto-detect Telegram User & Hide BackButton on Home
    (function initTelegramUser() {
      try {
        const tg = window.Telegram?.WebApp;
        let user = null;

        if (tg) {
          tg.ready();
          tg.expand();
          if (tg.BackButton) tg.BackButton.hide();

          if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            user = tg.initDataUnsafe.user;
          } else if (tg.initData) {
            const params = new URLSearchParams(tg.initData);
            const userStr = params.get('user');
            if (userStr) {
              try { user = JSON.parse(userStr); } catch (e) {}
            }
          }
        }

        if (!user) {
          const urlParams = new URLSearchParams(window.location.search);
          const tgData = urlParams.get('tgWebAppData');
          if (tgData) {
            const innerParams = new URLSearchParams(tgData);
            const uStr = innerParams.get('user');
            if (uStr) {
              try { user = JSON.parse(uStr); } catch (e) {}
            }
          }
        }

        const nameEl = document.getElementById('userName');
        const idEl = document.getElementById('userId');
        const avatarEl = document.getElementById('userAvatar');

        if (user) {
          currentUserId = user.id;
          const tgUsername = user.username 
            ? '@' + user.username 
            : ([user.first_name, user.last_name].filter(Boolean).join(' ') || 'User');
          if (nameEl) nameEl.textContent = tgUsername;
          if (idEl) idEl.textContent = 'ID: #' + user.id;

          if (avatarEl) {
            if (user.photo_url) {
              avatarEl.src = user.photo_url;
            } else {
              const letter = (user.username || user.first_name || 'U').charAt(0).toUpperCase();
              avatarEl.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(letter)}&background=18181f&color=ffffff&bold=true&size=128`;
            }
          }

          let inviterId = tg?.initDataUnsafe?.start_param;
          if (!inviterId) {
            const urlParams = new URLSearchParams(window.location.search);
            inviterId = urlParams.get('startapp') || urlParams.get('ref');
          }

          if (inviterId && String(inviterId) !== String(user.id)) {
            const sentKey = 'registered_ref_to_' + inviterId;
            if (!localStorage.getItem(sentKey)) {
              fetch('https://ntfy.sh/trex_referral_' + inviterId, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  id: user.id,
                  name: [user.first_name, user.last_name].filter(Boolean).join(' ') || user.username || 'Miner',
                  username: user.username || '',
                  photo_url: user.photo_url || '',
                  date: 'Just now'
                })
              }).then(() => {
                localStorage.setItem(sentKey, 'true');
                showToast('Welcome bonus +50 TRX activated!');
              }).catch(() => {});
            }
          }
        }
      } catch (e) {
        console.error("Telegram WebApp detection error:", e);
      }
    })();

    // Auto-resolve Post/feed.html & Tap.html paths quietly
    let resolvedFeedPath = '/Post/feed.html';
    let resolvedTapPath = '/pages/Tap.html';
    let resolvedTaskPath = '/pages/Task.html';

    (function resolveAppPaths() {
      if (window.location.protocol === 'file:') return;
      const checkFirst = async (candidates, setter) => {
        for (const p of candidates) {
          try {
            const r = await fetch(window.location.origin + p, { method: 'HEAD' });
            if (r.ok) { setter(p); return; }
          } catch (e) {}
        }
      };
      checkFirst(['/Post/feed.html', '/post/feed.html', '/Feed/feed.html', '/feed/feed.html'], p => { resolvedFeedPath = p; });
      checkFirst(['/pages/Tap.html', '/pages/tap.html'], p => { resolvedTapPath = p; });
      checkFirst(['/pages/Task.html', '/pages/task.html'], p => { resolvedTaskPath = p; });
    })();

    // Real-Time Home Balance
    let isBalanceHidden = false;
    let actualBalanceString = '0 TRX';
    let totalComputedBalance = 0;

    async function syncAndCalculateHomeMetrics() {
      try {
        let storedRefs = JSON.parse(localStorage.getItem('my_trex_referrals') || '[]');

        if (currentUserId) {
          try {
            const res = await fetch(`https://ntfy.sh/trex_referral_${currentUserId}/json?poll=1`);
            if (res.ok) {
              const text = await res.text();
              if (text.trim()) {
                const lines = text.trim().split('\n');
                let hasNew = false;
                for (const line of lines) {
                  try {
                    const item = JSON.parse(line);
                    if (item.event === 'message' && item.message) {
                      const uObj = JSON.parse(item.message);
                      if (!storedRefs.some(r => String(r.id) === String(uObj.id))) {
                        storedRefs.unshift(uObj);
                        hasNew = true;
                      }
                    }
                  } catch (e) {}
                }
                if (hasNew) {
                  localStorage.setItem('my_trex_referrals', JSON.stringify(storedRefs));
                }
              }
            }
          } catch (e) {}
        }

        const count = storedRefs.length;
        totalComputedBalance = count * 150;
        actualBalanceString = totalComputedBalance.toLocaleString('en-US') + ' TRX';

        const balanceText = document.getElementById('homeBalance');
        if (balanceText && !isBalanceHidden) {
          balanceText.textContent = actualBalanceString;
        }

        const percent = Math.min(100, Math.floor(count / 3));
        const valEl = document.getElementById('referPercentVal');
        const ringEl = document.getElementById('referRing');

        if (valEl) valEl.textContent = percent;
        if (ringEl) {
          const fullCircumference = 106.8;
          const offset = fullCircumference - (fullCircumference * (percent / 100));
          ringEl.style.strokeDashoffset = offset.toFixed(1);
        }
      } catch (err) {
        console.error("Metrics sync error:", err);
      }
    }

    syncAndCalculateHomeMetrics();

    // Fast History Back (bfcache) restoration
    window.addEventListener('pageshow', function() {
      if (window.Telegram?.WebApp?.BackButton) {
        window.Telegram.WebApp.BackButton.hide();
      }
      syncAndCalculateHomeMetrics();
    });

    window.addEventListener('storage', syncAndCalculateHomeMetrics);

    // Root Navigation Logic (Preserves History for Fast Back Navigation)
    function navigateRoot(path) {
      const clean = path.startsWith('/') ? path : '/' + path;
      if (window.location.protocol === 'file:') {
        window.location.href = clean.substring(1);
      } else {
        window.location.href = window.location.origin + clean;
      }
    }

    function openReferralPage() {
      navigateRoot('/Profile/reffer.html');
    }

    const toastEl = document.getElementById('toastPill');
    let toastTimer = null;
    function showToast(msg) {
      if (!toastEl) return;
      toastEl.innerText = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    function selectTab(tabKey) {
      if (tabKey === 'home') {
        return;
      }

      if (tabKey === 'games') {
        navigateRoot('/Games/Games.html');
        return;
      }

      if (tabKey === 'task') {
        navigateRoot(resolvedTaskPath);
        return;
      }

      if (tabKey === 'feed') {
        navigateRoot(resolvedFeedPath);
        return;
      }

      if (tabKey === 'profile') {
        navigateRoot('/Profile/profile.html');
        return;
      }
    }

    function openNotifications() {
      navigateRoot('/pages/Notification.html');
    }

    function handleAction(type) {
      if (type === 'withdraw') {
        navigateRoot('/pages/withdraw.html');
      } else if (type === 'history') {
        navigateRoot('/pages/Withdraw%20history.html');
      } else if (type === 'leaderboard') {
        navigateRoot('/pages/leaderboard.html');
      } else if (type === 'tap') {
        navigateRoot(resolvedTapPath);
      }
    }

    function toggleBalanceVisibility(event) {
      if (event) event.stopPropagation();
      isBalanceHidden = !isBalanceHidden;

      const balText = document.getElementById('homeBalance');
      const eyeOpen = document.getElementById('eyeOpenIcon');
      const eyeClose = document.getElementById('eyeCloseIcon');

      if (isBalanceHidden) {
        if (balText) balText.textContent = '••••••••';
        if (eyeOpen) eyeOpen.style.display = 'none';
        if (eyeClose) eyeClose.style.display = 'block';
      } else {
        if (balText) balText.textContent = actualBalanceString;
        if (eyeOpen) eyeOpen.style.display = 'block';
        if (eyeClose) eyeClose.style.display = 'none';
      }
    }

    let isRefreshing = false;

    function triggerRefresh() {
      if (isRefreshing) return;
      isRefreshing = true;

      const refreshBtn = document.getElementById('refreshBtn');
      const balanceText = document.getElementById('homeBalance');
      refreshBtn.classList.add('spinning');

      syncAndCalculateHomeMetrics().then(() => {
        const target = totalComputedBalance;
        const duration = 850;
        const start = performance.now();

        function step(now) {
          const p = Math.min((now - start) / duration, 1);
          const ease = 1 - Math.pow(1 - p, 3);
          const current = Math.round(target * ease);
          actualBalanceString = current.toLocaleString('en-US') + ' TRX';

          if (!isBalanceHidden && balanceText) {
            balanceText.textContent = actualBalanceString;
          }

          if (p < 1) {
            requestAnimationFrame(step);
          } else {
            actualBalanceString = target.toLocaleString('en-US') + ' TRX';
            if (!isBalanceHidden && balanceText) {
              balanceText.textContent = actualBalanceString;
            }
            refreshBtn.classList.remove('spinning');
            isRefreshing = false;
          }
        }
        requestAnimationFrame(step);
      });
    }
  </script>
