<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starting...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      user-select: none;
    }

    .container {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000000;
      transition: opacity 0.45s ease-out;
    }

    /* Ultra Clear / High Quality Video */
    .video-player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
      transform: translateZ(0);
      will-change: opacity;
      pointer-events: none;
      outline: none;
    }

    video::-webkit-media-controls,
    video::-webkit-media-controls-enclosure,
    video::-webkit-media-controls-panel,
    video::-webkit-media-controls-play-button,
    video::-webkit-media-controls-start-playback-button {
      display: none !important;
      -webkit-appearance: none;
    }

    .fade {
      opacity: 0;
    }
  </style>
</head>
<body>

  <div class="container" id="wrapper">
    <video 
      id="intro" 
      class="video-player" 
      autoplay 
      muted 
      playsinline 
      preload="auto"
      disablepictureinpicture
      disableremoteplayback
      tabindex="-1"
      poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
    >
      <source src="assets/start.mp4" type="video/mp4">
    </video>
  </div>

  <script>
    try {
      sessionStorage.setItem('trex_intro_shown', '1');
    } catch (e) {}

    const wrapper = document.getElementById('wrapper');
    const video = document.getElementById('intro');

    video.play().catch(() => {});

    let redirected = false;
    function goHome() {
      if (redirected) return;
      redirected = true;
      wrapper.classList.add('fade');
      setTimeout(() => {
        const q = window.location.search || '';
        const h = window.location.hash || '';
        const sep = q ? '&' : '?';
        const target = q.indexOf('intro=1') !== -1
          ? ('index.html' + q + h)
          : ('index.html' + q + sep + 'intro=1' + h);
        window.location.replace(target);
      }, 450);
    }

    // 2.5s intro + 0.45s fade (~3 seconds total)
    setTimeout(goHome, 2500);
  </script>

</body>
</html>
