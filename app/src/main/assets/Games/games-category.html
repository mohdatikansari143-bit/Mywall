<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>All Category Games – 500 Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; height:100dvh; overflow:hidden; overscroll-behavior:none; background:#000; position:fixed; inset:0; }
  body { color:#fff; display:flex; justify-content:center; -webkit-font-smoothing:antialiased; }
  .app-container { width:100%; max-width:480px; height:100%; display:flex; flex-direction:column; background:#000; overflow:hidden; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  .top-nav { flex-shrink:0; display:flex; align-items:center; gap:6px; padding:10px 12px 12px 12px; overflow:hidden; }
  .back-btn { position:relative; flex-shrink:0; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff; background:radial-gradient(120% 120% at 30% 15%,rgba(255,255,255,0.28) 0%,rgba(255,255,255,0.08) 45%,rgba(255,255,255,0.03) 100%); -webkit-backdrop-filter:blur(22px) saturate(200%); backdrop-filter:blur(22px) saturate(200%); border:1px solid rgba(255,255,255,0.22); box-shadow:inset 0 1.5px 0 rgba(255,255,255,0.55),inset 0 -2px 4px rgba(255,255,255,0.08),inset 0 0 0 1px rgba(0,0,0,0.35),0 0 0 1px rgba(0,0,0,0.9),0 8px 20px rgba(0,0,0,0.85),0 0 14px rgba(255,255,255,0.06); transition:transform .18s cubic-bezier(.3,1.4,.5,1),box-shadow .18s,background .18s; }
  .back-btn::before { content:""; position:absolute; top:3px; left:8px; right:8px; height:46%; border-radius:50% 50% 60% 60% / 80% 80% 40% 40%; background:linear-gradient(180deg,rgba(255,255,255,0.35),rgba(255,255,255,0)); pointer-events:none; }
  .back-btn::after { content:""; position:absolute; bottom:3px; left:12px; right:12px; height:22%; border-radius:50%; background:radial-gradient(ellipse at center,rgba(255,255,255,0.14),transparent 70%); pointer-events:none; }
  .back-btn svg { position:relative; z-index:1; width:22px; height:22px; margin-right:2px; filter:drop-shadow(0 1px 2px rgba(0,0,0,0.6)); }
  .back-btn:active { transform:scale(0.88); }
  .tabs { flex:1; min-width:0; display:flex; justify-content:space-around; align-items:center; }
  .tab-link { font-size:15px; font-weight:700; color:#85858a; text-decoration:none; white-space:nowrap; cursor:pointer; transition:color .2s; }
  .tab-link.active { color:#fff; }
  .body-layout { flex:1; min-height:0; display:flex; padding-bottom:10px; }
  .sidebar { width:76px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:6px; padding:0 0 20px 8px; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; scrollbar-width:none; }
  .sidebar::-webkit-scrollbar { display:none; }
  .side-item { width:64px; min-height:72px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; border-radius:18px; text-decoration:none; color:#8f8f95; border:1px solid transparent; cursor:pointer; transition:background .2s,color .2s,border-color .2s; }
  .side-item i { font-size:22px; }
  .side-item span { font-size:11px; font-weight:600; letter-spacing:-0.2px; white-space:nowrap; }
  .side-item.active { color:#fff; background:#0d0d0d; border-color:#26262a; box-shadow:0 4px 14px rgba(0,0,0,0.8); }
  .content-card { flex:1; min-width:0; min-height:0; margin:0 8px 0 4px; padding:18px 12px 12px 10px; background:#0f0f0f; border:1px solid #1a1a1c; border-radius:28px; display:flex; flex-direction:column; gap:14px; overflow:hidden; }
  .ranking-header { flex-shrink:0; display:flex; align-items:center; padding:0 4px; }
  .ranking-title { font-size:19px; font-weight:800; letter-spacing:-0.4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .category-pill { flex-shrink:0; display:flex; justify-content:space-between; align-items:center; gap:10px; padding:13px 14px; background:#050505; border:1px solid #222225; border-radius:14px; font-size:14px; font-weight:600; }
  .category-pill .cat-name { color:#fff; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .category-pill .cat-count { flex-shrink:0; font-size:13px; font-weight:700; color:#f7b731; }
  .games-list { flex:1; min-height:0; display:flex; flex-direction:column; gap:10px; margin-top:2px; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; scrollbar-width:none; padding-bottom:12px; }
  .games-list::-webkit-scrollbar { display:none; }
  .game-row { flex-shrink:0; display:flex; align-items:center; gap:10px; border-radius:14px; cursor:pointer; transition:background .15s; }
  .game-row:active { background:rgba(255,255,255,0.04); }
  .rank-col { width:50px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .gold-badge { width:52px; height:52px; filter:drop-shadow(0 0 7px rgba(255,190,40,0.65)) drop-shadow(0 0 16px rgba(255,170,0,0.35)); }
  .gold-badge svg { width:100%; height:100%; display:block; }
  .normal-badge { width:34px; height:40px; border-radius:9px; background:#070707; border:1px solid #2d2d30; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; color:#fff; }
  .game-icon { width:62px; height:62px; border-radius:14px; flex-shrink:0; object-fit:cover; background:#1c1c1f; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08),0 4px 12px rgba(0,0,0,0.5); }
  .game-details { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; padding-left:4px; }
  .game-title { font-size:16px; font-weight:800; letter-spacing:-0.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .game-sub { font-size:13px; font-weight:500; color:#9a9aa0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .empty { margin:auto; text-align:center; color:#6f6f76; font-size:14px; font-weight:600; padding:30px 10px; }
  .empty i { display:block; font-size:28px; margin-bottom:10px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="goldG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE68A"/><stop offset="0.5" stop-color="#FFC531"/><stop offset="1" stop-color="#E8930C"/></linearGradient><linearGradient id="goldLeaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD85A"/><stop offset="1" stop-color="#E2890A"/></linearGradient></defs></svg>

<div class="app-container">
  <header class="top-nav">
    <div class="back-btn" onclick="handleBackAction()" role="button" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19"/></svg>
    </div>
    <nav class="tabs" id="tabs">
      <a class="tab-link active" data-cat="All">Games</a>
      <a class="tab-link" data-cat="Racing">Racing</a>
      <a class="tab-link" data-cat="Puzzle">Puzzle</a>
      <a class="tab-link" data-cat="Board">Board</a>
      <a class="tab-link" data-cat="Endless">Endless</a>
    </nav>
  </header>

  <div class="body-layout">
    <aside class="sidebar" id="sidebar">
      <a class="side-item active" data-cat="All"><i class="fa-solid fa-table-cells-large"></i><span>Games</span></a>
      <a class="side-item" data-cat="Endless"><i class="fa-solid fa-infinity"></i><span>Endless</span></a>
      <a class="side-item" data-cat="Racing"><i class="fa-solid fa-flag-checkered"></i><span>Racing</span></a>
      <a class="side-item" data-cat="Sports"><i class="fa-solid fa-headphones"></i><span>Sports</span></a>
      <a class="side-item" data-cat="Shooter"><i class="fa-solid fa-crosshairs"></i><span>Shooter</span></a>
      <a class="side-item" data-cat="Survival"><i class="fa-solid fa-shield-halved"></i><span>Survival</span></a>
      <a class="side-item" data-cat="Board"><i class="fa-solid fa-chess-knight"></i><span>Board</span></a>
      <a class="side-item" data-cat="Stick man"><i class="fa-solid fa-person-running"></i><span>Stick man</span></a>
      <a class="side-item" data-cat="Fighting"><i class="fa-solid fa-hand-fist"></i><span>Fighting</span></a>
      <a class="side-item" data-cat="Puzzle"><i class="fa-solid fa-puzzle-piece"></i><span>Puzzle</span></a>
      <a class="side-item" data-cat="Strategy"><i class="fa-solid fa-chess"></i><span>Strategy</span></a>
      <a class="side-item" data-cat="Casual"><i class="fa-solid fa-face-smile"></i><span>Casual</span></a>
    </aside>

    <main class="content-card">
      <div class="ranking-header"><span class="ranking-title">All Category Games</span></div>
      <div class="category-pill"><span class="cat-name" id="catName">Games</span><span class="cat-count" id="catCount">0 Games</span></div>
      <div class="games-list" id="list"></div>
    </main>
  </div>
</div>

<script type="module" src="/ts-dist/Games/games-category.js"></script>
</body>
</html>
