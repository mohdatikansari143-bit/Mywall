<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Trex Games</title>

<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@700;800;900&display=swap" rel="stylesheet">

<style>
/* FULL RESET */
html, body {
  background-color: #000 !important;
  color: #fff;
  margin: 0;
  padding: 0;
  min-height: 100vh;
  font-family: 'Inter', sans-serif;
  font-weight: 800;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  scrollbar-width: none !important;
  -ms-overflow-style: none !important;
}

body {
  display: flex;
  justify-content: center;
  -webkit-overflow-scrolling: touch;
  background: #000;
}

* {
  box-sizing: border-box;
  user-select: none;
  scrollbar-width: none !important;
  -ms-overflow-style: none !important;
}

::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}

.app-screen {
  width: 100%;
  max-width: 440px;
  min-height: 100vh;
  background: #000;
  padding: 0 0 120px 0;
  position: relative;
  overflow-x: clip;
}

/* TOP HEADER */
.top-header {
  position: sticky;
  top: 0;
  z-index: 60;
  background: rgba(0,0,0,0.92);
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding: calc(12px + env(safe-area-inset-top)) 18px 12px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.logo-img {
  height: 34px;
  width: auto;
  max-width: 200px;
  object-fit: contain;
  display: block;
}

/* ============================================================
   ORIGINAL HERO SLIDER WITH ROCK-SOLID STABLE TITLES
   ============================================================ */
.hero-wrap {
  position: relative;
  width: 100%;
  height: 590px;
  overflow: hidden;
  touch-action: pan-y;
  background: #050508;
}

.hero-slide {
  position: absolute;
  inset: 0;
  visibility: hidden;
  z-index: 1;
  overflow: hidden;
}

.hero-slide.prev {
  visibility: visible;
  z-index: 1;
}

.hero-slide.prev .hero-info {
  opacity: 0;
  transition: opacity 0.2s ease-out;
  pointer-events: none;
}

.hero-slide.active {
  visibility: visible;
  z-index: 2;
}

.hero-bg-media {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
}

.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to right, rgba(0,0,0,.88) 0%, rgba(0,0,0,.45) 55%, rgba(0,0,0,.7) 100%),
              linear-gradient(to top, rgba(0,0,0,.96) 0%, rgba(0,0,0,.35) 45%, rgba(0,0,0,.25) 100%);
  pointer-events: none;
}

/* FIXED & LOCKED HERO INFO (NO JUMPING AAGE-PICHE) */
.hero-info {
  position: absolute;
  left: 20px;
  right: 20px;
  top: 55px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  text-align: left;
  pointer-events: none;
}

.hero-info > * {
  pointer-events: auto;
}

.hero-slide.active .hero-info > * {
  animation: heroTextRise .35s cubic-bezier(.16,1,.3,1) both;
}
.hero-slide.active .hero-info > :nth-child(2) { animation-delay: .03s; }
.hero-slide.active .hero-info > :nth-child(3) { animation-delay: .06s; }
.hero-slide.active .hero-info > :nth-child(4) { animation-delay: .09s; }

@keyframes heroTextRise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.hero-subtitle-line {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: rgba(255,255,255,.85);
  height: 20px;
  margin-bottom: 8px;
}

.hero-subtitle-line::before {
  content: "";
  width: 22px;
  height: 3.5px;
  background: #ffd84d;
  border-radius: 2px;
}

/* FIXED HEIGHT FOR TITLE (PREVENTS PUSHING OTHER ELEMENTS) */
.hero-info h2 {
  margin: 0;
  font-family: 'Bebas Neue', 'Inter', sans-serif;
  font-weight: 400;
  font-size: 48px;
  line-height: .92;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #fff;
  width: 100%;
  max-width: 310px;
  height: 90px; /* Fixed height for 1 or 2 lines */
  display: flex;
  align-items: flex-start;
  text-shadow: 0 4px 18px rgba(0,0,0,0.9);
  margin-bottom: 8px;
}

/* FIXED HEIGHT FOR DESC */
.hero-info p {
  margin: 0;
  font-size: 13.5px;
  font-weight: 600;
  color: rgba(255,255,255,.88);
  max-width: 280px;
  height: 40px; /* Fixed height */
  line-height: 1.4;
  text-shadow: 0 2px 10px rgba(0,0,0,0.9);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 12px;
}

.hero-play {
  height: 46px;
  padding: 0 28px;
  border-radius: 999px;
  border: 2px solid rgba(255,255,255,.75);
  background: transparent;
  color: #fff;
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  font-weight: 900;
  letter-spacing: .8px;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform .15s ease, background .2s ease;
  position: relative;
  z-index: 15;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
}
.hero-play:active {
  transform: scale(.94);
  background: rgba(255,255,255,.2);
}

/* HERO CARDS PREVIEW RAIL */
.hero-rail-wrap {
  position: absolute;
  left: 20px;
  right: 0;
  bottom: 84px;
  z-index: 8;
  overflow: hidden;
  padding: 6px 0;
}
.hero-rail {
  display: flex;
  gap: 12px;
  transition: transform .3s ease;
}
.hero-rail.in {
  animation: railSlideIn .4s cubic-bezier(.16,1,.3,1);
}
@keyframes railSlideIn {
  from { transform: translateX(35px); opacity: 0; }
  to { transform: none; opacity: 1; }
}

.hero-thumb {
  position: relative;
  flex: 0 0 110px;
  height: 152px;
  border-radius: 20px;
  overflow: hidden;
  cursor: pointer;
  border: 1.5px solid rgba(255,255,255,.25);
  box-shadow: 0 12px 26px rgba(0,0,0,.65);
  transition: transform .15s ease;
}
.hero-thumb:active {
  transform: scale(.95);
}
.hero-thumb-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
}
.hero-thumb-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%);
}
.hero-thumb-meta {
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.hero-thumb-meta span {
  font-size: 9.5px;
  font-weight: 700;
  color: rgba(255,255,255,0.7);
  text-transform: uppercase;
  letter-spacing: .5px;
}
.hero-thumb-meta b {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  line-height: 1;
  text-transform: uppercase;
  color: #fff;
  letter-spacing: .5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* HERO CONTROLS */
.hero-ctrl {
  position: absolute;
  left: 20px;
  right: 20px;
  bottom: 20px;
  z-index: 9;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.hero-ctrl-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.hero-arrow {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,.45);
  background: rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform .12s, background .15s;
}
.hero-arrow:active {
  transform: scale(.9);
  background: rgba(255,255,255,.25);
  border-color: #fff;
}
.hero-arrow svg {
  width: 18px;
  height: 18px;
  stroke: #fff;
  stroke-width: 2.5;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.hero-counter {
  font-family: 'Bebas Neue', 'Inter', sans-serif;
  font-size: 40px;
  line-height: 1;
  color: #fff;
  letter-spacing: 1px;
  min-width: 40px;
  text-align: right;
}

/* SECTIONS */
.section {
  padding-top: 28px;
}
.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  margin-bottom: 14px;
}
.sec-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 21px;
  font-weight: 900;
  letter-spacing: -.4px;
  color: #fff;
}
.sec-title svg {
  width: 18px;
  height: 18px;
  stroke: #8e8e93;
  stroke-width: 3;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  margin-top: 2px;
}
.sec-sub {
  font-size: 12px;
  font-weight: 800;
  color: #8e8e93;
}
.see-all {
  font-size: 12.5px;
  font-weight: 800;
  color: #fff;
  background: rgba(255,255,255,.1);
  padding: 6px 13px;
  border-radius: 999px;
  cursor: pointer;
}

.h-scroll {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 0 18px 28px 18px;
  margin-bottom: -22px;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
}

/* 1. TRENDING NOW */
.rank-item {
  display: flex;
  align-items: flex-end;
  flex-shrink: 0;
  cursor: pointer;
  scroll-snap-align: start;
  transition: transform .15s;
}
.rank-item:active {
  transform: scale(.96);
}
.rank-num {
  font-family: 'Inter', sans-serif;
  font-size: 110px;
  font-weight: 900;
  line-height: .8;
  color: transparent;
  -webkit-text-stroke: 3px #3a3a40;
  letter-spacing: -8px;
  margin-right: 2px;
  margin-bottom: -4px;
  z-index: 0;
}
.rank-poster {
  position: relative;
  width: 128px;
  height: 176px;
  border-radius: 22px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 12px 26px rgba(0,0,0,.6), inset 0 1px 1px rgba(255,255,255,.3);
  z-index: 1;
  background-size: cover;
  background-position: center;
}
.rank-poster .poster-meta {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 26px 11px 11px;
  background: linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.4) 60%, transparent 100%);
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.poster-name {
  font-size: 14px;
  font-weight: 900;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}
.poster-genre {
  font-size: 11px;
  font-weight: 700;
  color: #d1d1d6;
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}

/* 2. VIEW ALL GAMES */
.deck-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px 14px;
  padding: 0 18px;
}
.deck-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: transform .15s ease;
}
.deck-box:active {
  transform: scale(0.96);
}
.deck-stage {
  position: relative;
  width: 100%;
  height: 165px;
  display: flex;
  justify-content: center;
  align-items: flex-end;
}
.deck-fan {
  position: absolute;
  top: 10px;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.deck-card {
  position: absolute;
  width: 86px;
  height: 118px;
  border-radius: 9px;
  background-size: cover;
  background-position: center;
  box-shadow: 0 10px 22px rgba(0,0,0,0.7);
  border: 1px solid rgba(255,255,255,0.18);
  transition: transform .2s ease;
}
.deck-card.c-left { transform: translate(-15px, 2px) rotate(-10deg); z-index: 1; }
.deck-card.c-right { transform: translate(15px, 0px) rotate(10deg); z-index: 2; }
.deck-card.c-mid { transform: translate(0px, 8px) rotate(0deg); z-index: 3; }
.deck-pocket {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 82px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.22);
  box-shadow: 0 10px 24px rgba(0,0,0,0.6);
  z-index: 4;
}
.bolt {
  position: absolute;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: radial-gradient(circle, #f3f3f3 25%, #999 65%, #444 100%);
  border: 0.5px solid rgba(0,0,0,0.6);
  box-shadow: 0 1px 2px rgba(0,0,0,0.8);
}
.bolt.tl { top: 6px; left: 6px; }
.bolt.tr { top: 6px; right: 6px; }
.bolt.bl { bottom: 6px; left: 6px; }
.bolt.br { bottom: 6px; right: 6px; }
.deck-label {
  margin-top: 10px;
  font-size: 13.5px;
  font-weight: 800;
  text-align: center;
  color: #fff;
  letter-spacing: -0.2px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.deck-label span.sub {
  color: #8e8e93;
  font-weight: 600;
  font-size: 12px;
}

/* 3. MOST PLAYED */
.mp-rank-scroll {
  display: flex;
  gap: 18px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 6px 20px 26px 20px;
  margin-bottom: -20px;
  scroll-snap-type: x mandatory;
  scroll-padding: 0 20px;
  scroll-padding-left: 20px;
  -webkit-overflow-scrolling: touch;
}

.mp-rank-column {
  flex: 0 0 320px;
  max-width: 85%;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scroll-snap-align: start;
  padding-left: 4px;
}

.mp-item-row {
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: transform .12s ease;
  padding: 2px 4px 2px 2px;
  border-radius: 12px;
}
.mp-item-row:active {
  transform: scale(0.97);
}

.mp-badge-box {
  width: 42px;
  height: 42px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  position: relative;
  font-family: 'Inter', sans-serif;
  font-weight: 900;
  font-size: 19px;
  line-height: 1;
  box-shadow: 0 4px 14px rgba(0,0,0,0.6);
  margin-left: 2px;
}

.mp-badge-box.top-three {
  background: #00e5c9;
  color: #031412;
  box-shadow: 0 0 16px rgba(0, 229, 201, 0.45);
}
.mp-badge-box.top-three svg.wreath {
  position: absolute;
  inset: 0;
  margin: auto;
  width: 36px;
  height: 36px;
  pointer-events: none;
}
.mp-badge-box span {
  position: relative;
  z-index: 2;
  display: block;
}

.mp-badge-box.other-ranks {
  background: #22262d;
  color: #e2e8f0;
  border: 1px solid rgba(255,255,255,0.12);
}

.mp-thumb-cover {
  width: 52px;
  height: 72px;
  border-radius: 8px;
  background-size: cover;
  background-position: center;
  flex-shrink: 0;
  box-shadow: 0 6px 14px rgba(0,0,0,0.7);
  border: 1px solid rgba(255,255,255,0.14);
}

.mp-meta-info {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1;
}
.mp-game-title {
  font-size: 15px;
  font-weight: 800;
  color: #fff;
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  letter-spacing: -0.2px;
}
.mp-game-genre {
  font-size: 13px;
  font-weight: 600;
  color: #8e8e93;
  margin-top: 3px;
}

/* 4. QUICK PLAY */
.list-card {
  margin: 0 18px;
  background: #0a0a0a;
  border: 1px solid #1f1f23;
  border-radius: 26px;
  padding: 6px 14px;
}
.list-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 0;
  border-bottom: 1px solid #1a1a1e;
  cursor: pointer;
  transition: transform .12s ease;
}
.list-row:last-child { border-bottom: none; }
.list-row:active { transform: scale(0.98); }
.qp-logo {
  width: 54px;
  height: 54px;
  border-radius: 14px;
  background-size: cover;
  background-position: center;
  flex-shrink: 0;
  box-shadow: 0 4px 14px rgba(0,0,0,0.6);
  border: 1px solid rgba(255,255,255,0.15);
}
.list-txt {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.list-name {
  font-size: 15.5px;
  font-weight: 900;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.list-meta {
  font-size: 12px;
  font-weight: 700;
  color: #8e8e93;
  display: flex;
  align-items: center;
  gap: 6px;
}
.list-meta b { color: #ffd84d; font-weight: 800; }
.list-play {
  background: rgba(255,255,255,.12);
  color: #fff;
  border: none;
  border-radius: 999px;
  padding: 8px 18px;
  font-family: 'Inter', sans-serif;
  font-size: 12.5px;
  font-weight: 900;
  letter-spacing:.5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform .15s, background .2s;
}
.list-play:active {
  transform: scale(.92);
  background: rgba(255,255,255,.25);
}

/* 5. NEW RELEASES */
.nr-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 0 18px;
}
.nr-card {
  background: #14191c;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 18px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  transition: transform .15s ease, border-color .2s ease;
  box-shadow: 0 8px 22px rgba(0,0,0,0.55);
}
.nr-card:active { transform: scale(0.97); }
.nr-banner {
  width: 100%;
  height: 96px;
  background-size: cover;
  background-position: center;
  position: relative;
}
.nr-banner-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(20,25,28,0.7) 100%);
}
.nr-content {
  padding: 9px 10px 11px 10px;
  display: flex;
  flex-direction: column;
  flex: 1;
  justify-content: space-between;
}
.nr-title {
  font-size: 13px;
  font-weight: 800;
  color: #fff;
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  height: 32px;
  margin-bottom: 2px;
}
.nr-desc {
  font-size: 10px;
  font-weight: 600;
  color: #879797;
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 8px;
}
.nr-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin-top: auto;
}
.nr-social { display: flex; align-items: center; gap: 5px; min-width: 0; }
.nr-avatars { display: flex; align-items: center; flex-shrink: 0; }
.nr-avatar {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 1.5px solid #14191c;
  margin-left: -5px;
}
.nr-avatar:first-child { margin-left: 0; }
.nr-count {
  font-size: 9.5px;
  font-weight: 700;
  color: #a4b4b4;
  white-space: nowrap;
}
.nr-play-btn {
  background: #252f33;
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: #fff;
  border-radius: 100px;
  padding: 4.5px 12px;
  font-size: 10.5px;
  font-weight: 800;
  cursor: pointer;
}

/* MATCHED BOTTOM NAV BAR */
.bottom-nav-bar {
  position: fixed;
  bottom: 0;

function renderRail(animate) {
  let s = '';
  for (let k = 1; k < HN; k++) {
    const idx = (heroIndex + k) % HN;
    const h = HERO[idx];
    s += '<div class="hero-thumb" data-i="' + idx + '" onclick="launchGame(\'' + h.name.replace(/'/g, "\\'") + '\', \'' + h.embed + '\')">' +
      '<div class="hero-thumb-bg" style="background-image:url(\'' + h.img + '\');"></div>' +
      '<div class="hero-thumb-overlay"></div>' +
      '<div class="hero-thumb-meta">' +
        '<span>' + h.genre + '</span>' +
        '<b>' + h.name + '</b>' +
      '</div>' +
    '</div>';
  }
  heroRail.innerHTML = s;
  heroRail.classList.remove('in');
  if (animate) {
    void heroRail.offsetWidth;
    heroRail.classList.add('in');
  }
}

function scheduleHero() {
  clearTimeout(heroTimer);
  heroTimer = setTimeout(() => goHero(heroIndex + 1), 3500);
}

function goHero(n) {
  n = (n + HN) % HN;
  if (n === heroIndex || heroBusy) return;
  heroBusy = true;

  const from = heroSlides[heroIndex];
  const to = heroSlides[n];
  const card = heroRail.querySelector('[data-i="' + n + '"]');
  const wr = heroWrap.getBoundingClientRect();

  let t = wr.height * 0.45, r = 20, b = 90, l = wr.width * 0.55;
  if (card) {
    const cr = card.getBoundingClientRect();
    t = cr.top - wr.top;
    l = cr.left - wr.left;
    r = wr.right - cr.right;
    b = wr.bottom - cr.bottom;
  }

  to.classList.add('active');
  from.classList.remove('active');
  from.classList.add('prev');

  const anim = to.animate(
    [
      { clipPath: 'inset(' + t + 'px ' + r + 'px ' + b + 'px ' + l + 'px round 20px)' },
      { clipPath: 'inset(0px 0px 0px 0px round 0px)' }
    ],
    { duration: 420, easing: 'cubic-bezier(0.2, 0.9, 0.3, 1)' }
  );

  heroIndex = n;
  heroCount.textContent = String(n + 1).padStart(2, '0');
  renderRail(true);
  scheduleHero();

  anim.onfinish = () => {
    from.classList.remove('prev');
    heroBusy = false;
  };
}

document.getElementById('hPrev').onclick = (e) => { e.stopPropagation(); goHero(heroIndex - 1); };

  touchStartTime = Date.now();
}, { passive: true });

heroWrap.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const dt = Date.now() - touchStartTime;
  if (Math.abs(dx) > 35 && Math.abs(dx) > Math.abs(dy) * 1.2 && dt < 450) {
    goHero(heroIndex + (dx < 0 ? 1 : -1));
  }
}, { passive: true });

document.addEventListener('visibilitychange', () => {
