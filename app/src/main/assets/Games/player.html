<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Game Player</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:700;overflow:hidden;overscroll-behavior:none}

/* Home */
#home{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;background:radial-gradient(120% 80% at 50% 0%,#14102a 0%,#07060f 55%,#000 100%);overflow:hidden}
.blob{position:absolute;border-radius:50%;pointer-events:none}
.b1{width:420px;height:420px;left:-140px;top:-80px;background:radial-gradient(circle,rgba(124,58,237,.42),rgba(124,58,237,0) 68%);animation:d1 16s ease-in-out infinite}
.b2{width:460px;height:460px;right:-180px;bottom:-120px;background:radial-gradient(circle,rgba(14,165,233,.35),rgba(14,165,233,0) 68%);animation:d2 19s ease-in-out infinite}
@keyframes d1{50%{transform:translate(90px,120px) scale(1.15)}}
@keyframes d2{50%{transform:translate(-110px,-90px) scale(1.12)}}
#home>*:not(.blob){position:relative;z-index:1}
#home h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-.5px; text-align:center; line-height: 1.2;}
#home p{margin:0;color:#8e8e93;font-size:14px}

/* Liquid glass dark black buttons */
.glass{border:1px solid rgba(255,255,255,.16);color:#fff;cursor:pointer;padding:0;font-family:inherit;
  background:linear-gradient(145deg,rgba(60,60,70,.55),rgba(0,0,0,.82));
  backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
  box-shadow:0 8px 22px rgba(0,0,0,.65),inset 0 1px 1px rgba(255,255,255,.3),inset 0 -1px 2px rgba(0,0,0,.6);
  transition:transform .15s ease,background .2s ease}
.glass:active{transform:scale(.88);background:linear-gradient(145deg,rgba(90,90,100,.6),rgba(10,10,14,.9))}
.glass.active{border-color:rgba(255,255,255,.55);box-shadow:0 0 14px rgba(255,255,255,.28),0 8px 22px rgba(0,0,0,.65),inset 0 1px 1px rgba(255,255,255,.45)}
.play{border-radius:999px;padding:0 40px;height:58px;font-size:18px;font-weight:900;min-width:220px;display:flex;align-items:center;justify-content:center;gap:10px}
.play svg{width:20px;height:20px}
.ib{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ib svg{width:22px;height:22px;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none}
.ib svg .f{fill:#fff}
.hidden{display:none!important}

/* Stage */
#stage{position:fixed;inset:0;background:#000;display:none;z-index:5}
#stage.on{display:block}
#stage iframe{width:100%;height:100%;border:0;display:block;background:#000}
#stage.rot{top:0;left:100vw;right:auto;bottom:auto;width:100vh;height:100vw;width:100dvh;height:100dvw;transform-origin:top left;transform:rotate(90deg)}
#bar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;display:flex;gap:10px;z-index:10}
#bar.min .ib:not(#tog){display:none}
#toast{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%);color:#fff;padding:10px 16px;border-radius:16px;font-size:13px;z-index:11;display:none;max-width:90%;text-align:center;
  background:linear-gradient(160deg,rgba(48,48,56,.75),rgba(0,0,0,.88));border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}

/* Exit dialog */
.dlg-ov{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:0 22px;opacity:0;visibility:hidden;transition:opacity .25s ease,visibility 0s linear .25s}
.dlg-ov.open{opacity:1;visibility:visible;transition:opacity .25s ease,visibility 0s}
.dlg{width:100%;max-width:400px;border-radius:30px;padding:26px 22px 22px;background:linear-gradient(160deg,rgba(48,48,56,.72),rgba(20,20,26,.88));backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 70px rgba(0,0,0,.75),inset 0 1px 1px rgba(255,255,255,.22),inset 0 -1px 2px rgba(0,0,0,.5);transform:translateY(18px) scale(.94);transition:transform .32s cubic-bezier(.16,1,.3,1)}
.dlg-ov.open .dlg{transform:none}
.dlg h2{margin:0 0 12px;font-size:27px;font-weight:900;letter-spacing:-.6px}
.dlg p{margin:0 0 22px;font-size:17px;line-height:1.45;color:#f2f2f7}
.dlg-act{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg-btn{height:54px;border-radius:999px;font-size:17px;font-weight:900;font-family:inherit;cursor:pointer;transition:transform .15s ease,background .2s ease}
.dlg-btn:active{transform:scale(.95)}
.dlg-cancel{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.12)}
.dlg-exit{background:#fff;color:#000;border:0;box-shadow:0 8px 22px rgba(255,255,255,.18)}
</style>
</head>
<body>
<div id="home">
  <div class="blob b1"></div><div class="blob b2"></div>
  <h1 id="gameTitle">🎮 Game</h1>
  <p>Tap Play and the game opens in full screen</p>
  <button class="glass play" id="playBtn" data-src="">
    <svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21" fill="#fff"/></svg>Play
  </button>
</div>

<div id="stage">
  <div id="bar">
    <button class="glass ib" id="land" aria-label="Landscape">
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="2"/><line x1="18" y1="12" x2="18.01" y2="12"/></svg>
    </button>
    <button class="glass ib" id="full" aria-label="Full screen">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button class="glass ib" id="close" aria-label="Close">
      <svg viewBox="0 0 24 24"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
    </button>
    <button class="glass ib" id="tog" aria-label="Hide buttons">
      <svg viewBox="0 0 24 24"><circle class="f" cx="12" cy="5" r="1.4"/><circle class="f" cx="12" cy="12" r="1.4"/><circle class="f" cx="12" cy="19" r="1.4"/></svg>
    </button>
  </div>
  <div id="toast"></div>
  <div class="dlg-ov" id="dlgOv">
    <div class="dlg" id="dlg">
      <h2>Exit game?</h2>
      <p>Are you sure that you want to exit the game?</p>
      <div class="dlg-act">
        <button class="dlg-btn dlg-cancel" id="dlgCancel">Cancel</button>
        <button class="dlg-btn dlg-exit" id="dlgExit">Exit</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/ts-dist/Games/player.js"></script>
</body>
    </html>
