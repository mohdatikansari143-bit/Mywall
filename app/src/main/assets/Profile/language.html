<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Language</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@700;900&display=swap">
<style>
:root{--bg:#000;--fg:#fff;--muted:#8a8a8a;--line:#1c1c1c;--font:"Lato","Helvetica Neue",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:700}
body{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{width:100%;max-width:640px;margin:0 auto;padding:0 18px}

/* top bar */
.bar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar .wrap{display:flex;align-items:center;gap:14px;min-height:72px}
.bar h1{margin:0;flex:1;font-size:19px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
.back-btn{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;color:#fff;border-radius:50%;background:radial-gradient(circle at 50% 30%,#2a2a2a,#0d0d0d 75%);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 2px rgba(255,255,255,.12),0 3px 10px rgba(0,0,0,.8);transition:transform .15s}
.back-btn svg{width:20px;height:20px;display:block}
.back-btn:active{transform:scale(.92)}

/* Capsule pill save button (Image 1 Style - by default hidden) */
.save-btn{
  display:none;
  align-items:center;
  justify-content:center;
  height:36px;
  padding:0 22px;
  flex:none;
  border-radius:9999px;
  background:transparent;
  color:#ffffff;
  border:2px solid #ffffff;
  font-family:var(--font);
  font-size:13.5px;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
  cursor:pointer;
  transition:transform .15s ease, opacity .15s ease, background .15s ease;
}
.save-btn.visible{
  display:inline-flex;
}
.save-btn:active{
  transform:scale(.93);
  background:rgba(255,255,255,0.12);
}

/* text */
.sub{margin:26px 0 8px;font-size:13px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* list */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:16px;width:100%;padding:14px 0;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);font-family:var(--font);font-weight:700;text-align:left;cursor:pointer}
.item:last-child{border-bottom:0}

/* Pura Gool Flag (Image 2 Style) */
.flag{
  width:44px;
  height:44px;
  flex:none;
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#141416;
  box-shadow:0 0 0 1px rgba(255,255,255,.15);
}
.flag img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  border-radius:50%;
}

.name{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.name b{font-size:17px;font-weight:900}
.name small{font-size:13px;color:var(--muted);font-weight:700}
.chk{width:26px;height:26px;flex:none;border-radius:7px;border:2px solid #fff;background:transparent;display:flex;align-items:center;justify-content:center;transition:background .15s}
.chk svg{width:16px;height:16px;opacity:0;transition:opacity .15s}
.item.on .chk{background:#fff}
.item.on .chk svg{opacity:1}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#fff;color:#000;padding:12px 22px;border-radius:24px;font-size:14px;font-weight:900;opacity:0;pointer-events:none;transition:all .25s;z-index:9999}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Hide Google Translate top banner completely */
.goog-te-banner-frame, .goog-te-balloon-frame, #goog-gt-tt, .goog-te-banner-frame.skiptranslate, #google_translate_element { display: none !important; }
body { top: 0px !important; }
.goog-tooltip { display: none !important; }
.goog-text-highlight { background-color: transparent !important; border: none !important; box-shadow: none !important; }
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <button type="button" class="back-btn" aria-label="Back" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1>Language</h1>
    <button type="button" class="save-btn" id="save">Save</button>
  </div>
</header>

<main class="wrap">
  <div class="sub">Select language</div>
  <div class="list" id="list"></div>
</main>

<div class="toast" id="toast">Language saved</div>
<div id="google_translate_element" style="display:none;"></div>

<!-- Google Auto Translate Script -->
<script src="/ts-dist/Profile/language-init.js"></script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<script type="module" src="/ts-dist/Profile/language.js"></script>
</body>
</html>
