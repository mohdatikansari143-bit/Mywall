<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Create Post</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    /* Full Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: #000000 !important;
      color: #ffffff;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      -webkit-font-smoothing: antialiased;
    }

    /* Screen Container */
    .create-post-screen {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: #000000;
      position: relative;
    }

    /* Top Navigation Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #000000;
      flex-shrink: 0;
      z-index: 10;
    }

    /* Liquid Glass Back Button */
    .liquid-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 
        0 8px 25px rgba(0, 0, 0, 0.8),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.45),
        inset 0 -2px 3px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .liquid-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 45%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: 40px 40px 0 0;
      pointer-events: none;
    }

    .liquid-btn:active {
      transform: scale(0.90);
      background: rgba(255, 255, 255, 0.16);
    }

    .liquid-btn svg {
      width: 22px;
      height: 22px;
      stroke: #ffffff;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* Post Pill Button */
    .post-btn {
      padding: 9px 22px;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 800;
      border: none;
      background: #1a1a1a;
      color: #555555;
      cursor: not-allowed;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
    }

    /* Active state jab Title, body ya media ho */
    .post-btn.active {
      background: #ffffff;
      color: #000000;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.25);
    }

    .post-btn.active:active {
      transform: scale(0.95);
      background: #e2e8f0;
    }

    /* Scrollable Editor Area */
    .editor-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px 18px;
      overflow-y: auto;
      overscroll-behavior-y: contain;
    }

    /* Title Input */
    .title-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 26px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 14px;
      font-family: 'Inter', sans-serif;
      resize: none;
    }

    .title-input::placeholder {
      color: #555555;
      font-weight: 800;
    }

    /* Body Text */
    .body-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #e2e8f0;
      font-size: 16.5px;
      font-weight: 700;
      line-height: 1.5;
      font-family: 'Inter', sans-serif;
      resize: none;
      min-height: 120px;
    }

    .body-input::placeholder {
      color: #555555;
      font-weight: 700;
    }

    /* Media Preview Box (For photo & video) */
    .media-preview-container {
      display: none;
      margin: 10px 0 15px 0;
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #333333;
      background: #0d0e12;
      max-height: 240px;
    }

    .media-preview-container img,
    .media-preview-container video {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
    }

    .remove-media-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 30px;
      height: 30px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      font-weight: 900;
      z-index: 5;
    }

    /* Bottom Action Toolbar */
    .bottom-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 10px 14px;
      background: #000000;
      border-top: 1px solid #1a1a1a;
      flex-shrink: 0;
      z-index: 20;
    }

    .tool-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: #ffffff;
      cursor: pointer;
      border-radius: 50%;
      transition: background 0.15s, transform 0.1s;
    }

    .tool-btn:active {
      background: rgba(255, 255, 255, 0.12);
      transform: scale(0.90);
    }

    .tool-btn svg {
      width: 22px;
      height: 22px;
      stroke: #ffffff;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .tool-btn span {
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
      font-family: 'Inter', sans-serif;
    }

    .hidden-file-input {
      display: none;
    }

    /* Custom Link Modal (Guaranteed to work on all phones) */
    .custom-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .custom-modal-card {
      width: 100%;
      max-width: 360px;
      background: #14151a;
      border: 1px solid #2e3038;
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }

    .custom-modal-title {
      font-size: 17px;
      font-weight: 900;
      color: #ffffff;
    }

    .custom-modal-input {
      width: 100%;
      background: #000000;
      border: 1px solid #333336;
      border-radius: 12px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 14.5px;
      font-family: 'Inter', sans-serif;
      outline: none;
    }

    .custom-modal-input:focus {
      border-color: #1d9bf0;
    }

    .custom-modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 5px;
    }

    .modal-btn {
      padding: 8px 18px;
      border-radius: 100px;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      border: none;
    }

    .modal-btn.cancel {
      background: #252730;
      color: #e2e8f0;
    }

    .modal-btn.confirm {
      background: #ffffff;
      color: #000000;
    }
  </style>
</head>
<body>

  <div class="create-post-screen" id="appScreen">

    <!-- Top Navigation Bar -->
    <div class="top-bar">
      <!-- Back Button -->
      <button class="liquid-btn" onclick="goBack()" title="Back">
        <svg viewBox="0 0 24 24">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <!-- Post Button -->
      <button class="post-btn" id="postBtn" onclick="submitPost()">Post</button>
    </div>

    <!-- Main Post Input Area -->
    <div class="editor-body">
      <!-- Media Preview Box -->
      <div class="media-preview-container" id="mediaPreviewBox">
        <button class="remove-media-btn" onclick="clearAttachedMedia()">×</button>
        <img id="previewImageEl" src="" alt="preview" style="display:none;">
        <video id="previewVideoEl" src="" controls playsinline style="display:none;"></video>
      </div>

      <!-- Title Input -->
      <textarea 
        class="title-input" 
        id="titleInput" 
        rows="1" 
        placeholder="Title"
        autocomplete="off" 
        autocorrect="off" 
        spellcheck="false"
      ></textarea>

      <!-- Body Input -->
      <textarea 
        class="body-input" 
        id="bodyInput" 
        placeholder="body text (optional)"
        autocomplete="off" 
        autocorrect="off" 
        spellcheck="false"
      ></textarea>
    </div>

    <!-- Bottom Toolbar -->
    <div class="bottom-toolbar">
      
      <!-- 1. Link Button -->
      <button class="tool-btn" type="button" onclick="openLinkModal()" title="Link">
        <svg viewBox="0 0 24 24">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
      </button>

      <!-- 2. Photo Button -->
      <button class="tool-btn" type="button" onclick="document.getElementById('photoInput').click()" title="Photo">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
      </button>

      <!-- 3. Video Button -->
      <button class="tool-btn" type="button" onclick="document.getElementById('videoInput').click()" title="Video">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"></circle>
          <polygon points="10 8 16 12 10 16 10 8" fill="#ffffff" stroke="none"></polygon>
        </svg>
      </button>

      <!-- 4. Hashtag (#) -->
      <button class="tool-btn" type="button" onclick="insertText('#')" title="Hashtag">
        <span>#</span>
      </button>

      <!-- 5. @ Mention -->
      <button class="tool-btn" type="button" onclick="insertText('@')" title="Mention">
        <span>@</span>
      </button>

    </div>

    <!-- Hidden Native File Inputs -->
    <input type="file" id="photoInput" class="hidden-file-input" accept="image/*">
    <input type="file" id="videoInput" class="hidden-file-input" accept="video/*">

  </div>

  <!-- Custom Link Modal -->
  <div class="custom-modal-overlay" id="linkModalOverlay">
    <div class="custom-modal-card">
      <div class="custom-modal-title">Insert Link</div>
      <input type="url" id="linkInputValue" class="custom-modal-input" placeholder="https://example.com">
      <div class="custom-modal-actions">
        <button class="modal-btn cancel" type="button" onclick="closeLinkModal()">Cancel</button>
        <button class="modal-btn confirm" type="button" onclick="confirmInsertLink()">Add Link</button>
      </div>
    </div>
  </div>

  <script>
    const titleInput = document.getElementById('titleInput');
    const bodyInput = document.getElementById('bodyInput');
    const postBtn = document.getElementById('postBtn');
    const photoInput = document.getElementById('photoInput');
    const videoInput = document.getElementById('videoInput');
    const mediaPreviewBox = document.getElementById('mediaPreviewBox');
    const previewImageEl = document.getElementById('previewImageEl');
    const previewVideoEl = document.getElementById('previewVideoEl');

    let lastFocusedInput = titleInput;
    let attachedPhotoData = null;
    let attachedVideoData = null;

    // Back to feed
    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'feed.html';
      }
    }

    titleInput.addEventListener('focus', () => { lastFocusedInput = titleInput; });
    bodyInput.addEventListener('focus', () => { lastFocusedInput = bodyInput; });

    function checkPostEligibility() {
      const hasTitle = titleInput.value.trim().length > 0;
      const hasBody = bodyInput.value.trim().length > 0;
      const hasMedia = attachedPhotoData !== null || attachedVideoData !== null;

      if (hasTitle || hasBody || hasMedia) {
        postBtn.classList.add('active');
      } else {
        postBtn.classList.remove('active');
      }
    }

    titleInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = this.scrollHeight + 'px';
      checkPostEligibility();
    });

    bodyInput.addEventListener('input', checkPostEligibility);

    // ==========================================
    // 1. PHOTO UPLOAD (Compressed so it never fails)
    // ==========================================
    photoInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 800;
          let w = img.width;
          let h = img.height;

          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }

          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          // Compress to lightweight JPEG
          attachedPhotoData = canvas.toDataURL('image/jpeg', 0.72);
          attachedVideoData = null; // Clear video if photo chosen

          previewVideoEl.style.display = 'none';
          previewVideoEl.src = '';
          previewImageEl.src = attachedPhotoData;
          previewImageEl.style.display = 'block';
          mediaPreviewBox.style.display = 'block';

          checkPostEligibility();
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    // ==========================================
    // 2. VIDEO UPLOAD (Added event listener)
    // ==========================================
    videoInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        attachedVideoData = evt.target.result;
        attachedPhotoData = null; // Clear photo if video chosen

        previewImageEl.style.display = 'none';
        previewImageEl.src = '';
        previewVideoEl.src = attachedVideoData;
        previewVideoEl.style.display = 'block';
        mediaPreviewBox.style.display = 'block';

        checkPostEligibility();
      };
      reader.readAsDataURL(file);
    });

    function clearAttachedMedia() {
      attachedPhotoData = null;
      attachedVideoData = null;
      photoInput.value = '';
      videoInput.value = '';
      previewImageEl.src = '';
      previewVideoEl.src = '';
      previewImageEl.style.display = 'none';
      previewVideoEl.style.display = 'none';
      mediaPreviewBox.style.display = 'none';
      checkPostEligibility();
    }

    // ==========================================
    // 3. CUSTOM LINK POPUP
    // ==========================================
    function openLinkModal() {
      document.getElementById('linkInputValue').value = '';
      document.getElementById('linkModalOverlay').style.display = 'flex';
      setTimeout(() => document.getElementById('linkInputValue').focus(), 100);
    }

    function closeLinkModal() {
      document.getElementById('linkModalOverlay').style.display = 'none';
    }

    function confirmInsertLink() {
      const url = document.getElementById('linkInputValue').value.trim();
      if (url) {
        bodyInput.focus();
        bodyInput.value += (bodyInput.value ? "\n" : "") + url;
        checkPostEligibility();
      }
      closeLinkModal();
    }

    // Insert # and @
    function insertText(char) {
      const input = lastFocusedInput;
      input.focus();
      const start = input.selectionStart || input.value.length;
      const end = input.selectionEnd || input.value.length;
      const val = input.value;
      input.value = val.substring(0, start) + char + val.substring(end);
      input.selectionStart = input.selectionEnd = start + 1;
      input.dispatchEvent(new Event('input'));
    }

    // ==========================================
    // 4. INDEXEDDB STORAGE (Saves even large files without crashing)
    // ==========================================
    function saveToIndexedDB(post) {
      return new Promise((resolve) => {
        try {
          const req = indexedDB.open('TrexFeedStorage', 1);
          req.onupgradeneeded = function(e) {
            e.target.result.createObjectStore('userPosts', { keyPath: 'id' });
          };
          req.onsuccess = function(e) {
            const db = e.target.result;
            const tx = db.transaction('userPosts', 'readwrite');
            tx.objectStore('userPosts').put(post);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          };
          req.onerror = () => resolve(false);
        } catch (err) {
          resolve(false);
        }
      });
    }

    // Post Submit
    async function submitPost() {
      const title = titleInput.value.trim();
      const body = bodyInput.value.trim();

      if (!title && !body && !attachedPhotoData && !attachedVideoData) {
        return;
      }

      postBtn.innerText = 'Posting...';
      postBtn.style.opacity = '0.6';

      const newPost = {
        id: 'usr_' + Date.now(),
        author: 'You',
        handle: '@you',
        time: 'Just now',
        title: title || (body ? body.substring(0, 30) + '...' : 'Shared Media'),
        body: body,
        image: attachedPhotoData,
        video: attachedVideoData,
        likes: 0,
        dislikes: 0,
        reposts: 0,
        comments: 0
      };

      // 1. Save in IndexedDB (Full size media support)
      await saveToIndexedDB(newPost);

      // 2. Also save in localStorage (Backup for instant load)
      try {
        const stored = JSON.parse(localStorage.getItem('feed_user_posts')) || [];
        // Light version without heavy video for localStorage
        const lightPost = { ...newPost };
        if (lightPost.video) lightPost.video = null; // video remains in IndexedDB
        stored.unshift(lightPost);
        localStorage.setItem('feed_user_posts', JSON.stringify(stored.slice(0, 20)));
      } catch (err) {
        console.warn('LocalStorage quota limit reached, stored in IndexedDB.');
      }

      // Feed page par wapas jaye
      window.location.href = 'feed.html';
    }

    // Keyboard resize
    if (window.visualViewport) {
      const handleResize = () => {
        const viewportHeight = window.visualViewport.height;
        document.getElementById('appScreen').style.height = `${viewportHeight}px`;
      };
      window.visualViewport.addEventListener('resize', handleResize);
      window.visualViewport.addEventListener('scroll', handleResize);
    }
  </script>

</body>
</html>
