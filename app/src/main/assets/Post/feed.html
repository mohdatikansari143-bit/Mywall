<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Social Feed</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* Full Black Reset & Invisible Scrollbar */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    *::-webkit-scrollbar,
    ::-webkit-scrollbar,
    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      background: transparent !important;
    }

    html, body {
      background-color: #000000 !important;
      color: #ffffff;
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
    }

    /* App Screen Wrapper */
    .app-screen {
      width: 100%;
      max-width: 440px;
      height: 100%;
      height: 100dvh;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      background: #000000;
      padding-bottom: 92px;
      position: relative;
    }

    /* ==========================================
       1. STICKY HEADER (PURE DARK & BOLD)
       ========================================== */
    .x-header-bar {
      position: sticky;
      top: 0;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid #1c1c1c;
      display: flex;
      flex-direction: column;
      z-index: 50;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
    }

    .header-logo-wrap {
      display: flex;
      align-items: center;
    }

    .header-logo-img {
      height: 48px;
      width: auto;
      max-width: 200px;
      object-fit: contain;
      display: block;
    }

    /* Top Right Plus (+) Button - Pure Dark & Bold */
    .header-add-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #000000;
      border: 2px solid #1c1c1c;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffffff;
      transition: transform 0.15s, background-color 0.15s, border-color 0.15s;
    }

    .header-add-btn:active {
      transform: scale(0.92);
      background-color: #0a0a0a;
      border-color: #2c2c2c;
    }

    .header-add-btn svg {
      width: 21px;
      height: 21px;
      stroke: #ffffff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* ==========================================
       2. POSTS TIMELINE (BOLD & DARK UI)
       ========================================== */
    .posts-timeline {
      display: flex;
      flex-direction: column;
      background: #000000;
    }

    .tweet-card {
      display: flex;
      gap: 12px;
      padding: 14px 16px;
      background: #000000;
      border-bottom: 1px solid #1c1c1c;
      transition: background 0.15s ease;
      cursor: pointer;
    }

    .tweet-card:active {
      background: rgba(255, 255, 255, 0.02);
    }

    .tweet-left-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: #0d0d0f;
    }

    .tweet-left-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .tweet-main-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tweet-author-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      line-height: 20px;
      margin-bottom: 3px;
    }

    .author-meta-names {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow: hidden;
      white-space: nowrap;
    }

    .author-name {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
    }

    .verified-badge-blue svg {
      width: 17px;
      height: 17px;
      fill: #1d9bf0;
      vertical-align: middle;
      display: inline-block;
    }

    .author-handle {
      font-size: 14px;
      font-weight: 700;
      color: #71767b;
      margin-left: 2px;
    }

    .tweet-time-dot {
      color: #71767b;
      font-size: 13.5px;
      font-weight: 700;
    }

    .tweet-top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #71767b;
    }

    .tweet-more-btn {
      background: none;
      border: none;
      color: #71767b;
      cursor: pointer;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tweet-more-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .tweet-post-title {
      font-size: 15.5px;
      font-weight: 800;
      color: #ffffff;
      margin-top: 2px;
      line-height: 1.35;
    }

    .tweet-content-text {
      font-size: 15px;
      font-weight: 700;
      line-height: 21px;
      color: #f4f4f5;
      margin-top: 3px;
      white-space: pre-line;
      word-break: break-word;
    }

    .tweet-link {
      color: #1d9bf0;
      font-weight: 800;
      text-decoration: none;
    }

    /* Media Wrapper & GIF Badge */
    .tweet-media-wrap {
      width: 100%;
      margin-top: 10px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #1c1c1c;
      background: #08080a;
      position: relative;
    }

    .tweet-media-wrap img,
    .tweet-media-wrap video {
      width: 100%;
      height: auto;
      max-height: 380px;
      object-fit: cover;
      display: block;
    }

    .gif-badge {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 5px;
      letter-spacing: 0.5px;
      backdrop-filter: blur(4px);
    }

    /* ==========================================
       3. POST ACTION BAR (Comment, Share, Like, Dislike, Views)
       ========================================== */
    .x-action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      width: 100%;
      color: #8a8a90;
      font-size: 13px;
      font-weight: 800;
    }

    .action-btn-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      color: #9ca3af;
      font-size: 13px;
      font-weight: 800;
      background: none;
      border: none;
      padding: 4px 2px;
      line-height: 1;
      transition: color 0.2s ease, transform 0.15s ease;
    }

    .action-btn-item svg {
      width: 20px;
      height: 20px;
      display: block;
      flex-shrink: 0;
    }

    .action-btn-item:active {
      transform: scale(0.92);
    }

    /* Comment & Share Hover */
    .action-btn-item.reply:hover,
    .action-btn-item.reply:active,
    .action-btn-item.share:hover,
    .action-btn-item.share:active {
      color: #ffffff;
    }

    .action-btn-item.views {
      cursor: default;
      color: #9ca3af;
    }

    .action-btn-item.views:active {
      transform: none;
    }

    /* Comment Page Exact Like & Dislike Styling */
    .like-icon, .dislike-icon {
      width: 22px !important;
      height: 22px !important;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
      overflow: visible !important;
      fill: currentColor;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.2s ease, filter 0.2s ease;
    }

    .action-btn-item.like:hover .like-icon,
    .action-btn-item.dislike:hover .dislike-icon {
      color: #f43f5e;
      transform: scale(1.12);
    }

    .action-btn-item.like.active {
      color: #f43f5e;
    }
    .action-btn-item.like.active .like-icon {
      color: #f43f5e !important;
      transform: scale(1.2);
      filter: drop-shadow(0 0 8px rgba(244, 63, 94, 0.6));
    }

    .action-btn-item.dislike.active {
      color: #f43f5e;
    }
    .action-btn-item.dislike.active .dislike-icon {
      color: #f43f5e !important;
      transform: scale(1.16);
      filter: drop-shadow(0 0 6px rgba(244, 63, 94, 0.55));
    }

    /* ==========================================
       4. BOTTOM NAVIGATION BAR (SAME AS HOME PAGE)
       ========================================== */
    .bottom-nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 74px;
      background: #000000;
      border-top: 1px solid #1c1c1c;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 8px;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: none;
      border: none;
      color: #777777;
      cursor: pointer;
      width: 64px;
      padding: 6px 0;
      position: relative;
      transition: color 0.15s, transform 0.15s;
    }

    .nav-item:active {
      transform: scale(0.92);
    }

    .nav-icon-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
    }

    .nav-item svg {
      width: 26px;
      height: 26px;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: all 0.2s ease;
    }

    .nav-item span {
      font-size: 11px;
      font-weight: 900;
      color: inherit;
      letter-spacing: -0.1px;
    }

    .nav-item.active {
      color: #ffffff;
    }

    /* Toast Notification */
    .toast-pill {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: #121214;
      color: #ffffff;
      border: 1px solid #2c2c2e;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.95);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 400;
    }
    .toast-pill.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="app-screen">

    <!-- 1. STICKY HEADER -->
    <div class="x-header-bar">
      <div class="header-top-row">
        <!-- Logo -->
        <div class="header-logo-wrap">
          <img src="../assets/logo.jpg" onerror="this.onerror=null; this.src='../Assets/logo.jpg';" alt="Logo" class="header-logo-img">

        <!-- Right Plus (+) Button (Dark & Bold) -->
        <button class="header-add-btn" onclick="openCreatePost()" title="Create Post">

            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- 2. TIMELINE POSTS -->
    <div class="posts-timeline" id="postsTimeline">

      <!-- Dynamic User Posts Appear Right Here -->

            <div class="tweet-top-actions">

                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle><circle cx="5" cy="12" r="1.5"></circle></svg>
              </button>
            </div>

          <!-- Meme Image with GIF Badge -->
          <div class="tweet-media-wrap">
            <img src="https://media.tenor.com/Eo-lFkSditYAAAAC/dont-disturb-me-study.gif" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1540573133985-87b6da6d54a9?auto=format&fit=crop&w=800&q=80';" alt="Monkey studying with headphones meme">
            <div class="gif-badge">GIF</div>
          </div>

          <!-- Action Bar: Comment, Share, Like, Dislike, Views -->
          <div class="x-action-bar">
            <!-- 1. Comment -->
            <button type="button" class="action-btn-item reply" onclick="handleReply('monkey')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>

            <!-- 2. Share -->

            <!-- 3. Like (Comment Page Butterfly Heart) -->
            <button type="button" class="action-btn-item like" id="likeBtn-monkey" onclick="handleLike('monkey')">
              <svg viewBox="0 0 64 64" preserveAspectRatio="xMidYMid meet" class="like-icon">

            <!-- 4. Dislike (Comment Page Middle Finger) -->

            <!-- 5. Views -->
            <div class="action-btn-item views">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

      </div>

      <!-- POST 1: TREX OFFICIAL (BLUE TICK) -->
      <div class="tweet-card" id="post-1">
        <div class="tweet-left-avatar" style="background: #000; border: 1px solid #38bdf8; display:flex; align-items:center; justify-content:center;">

            <div class="author-meta-names">

              <span class="verified-badge-blue">
                <svg viewBox="0 0 24 24"><path d="M22.5 12.5c0-1.58-.875-2.95-2.148-3.6.154-.435.238-.905.238-1.4 0-2.21-1.79-4-4-4-.495 0-.965.084-1.4.238C14.55 2.475 13.18 1.6 11.6 1.6c-1.58 0-2.95.875-3.6 2.148-.435-.154-.905-.238-1.4-.238-2.21 0-4 1.79-4 4 0 .495.084.965.238 1.4C1.575 9.55.7 10.92.7 12.5c0 1.58.875 2.95 2.148 3.6-.154.435-.238.905-.238 1.4 0 2.21 1.79 4 4 4 .495 0 .965-.084 1.4-.238.65 1.273 2.02 2.148 3.6 2.148 1.58 0 2.95-.875 3.6-2.148.435.154.905.238 1.4.238 2.21 0 4-1.79 4-4 0-.495-.084-.965-.238-1.4 1.273-.65 2.148-2.02 2.148-3.6zm-12.7 4.1l-3.9-3.9 1.4-1.4 2.5 2.5 6.3-6.3 1.4 1.4-7.7 7.7z"/></svg>
              </span>
              <span class="author-handle">@trexminer</span>
              <span class="tweet-time-dot">· 1h</span>
            </div>
            <button class="tweet-more-btn" onclick="showToast('Options')">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle><circle cx="5" cy="12" r="1.5"></circle></svg>
            </button>
          </div>

    // State Management
    const postState = {
      'monkey': { likes: 3000, dislikes: 0, liked: false, disliked: false },
      1: { likes: 4820, dislikes: 4, liked: false, disliked: false }
    };

    function getIndexedDBPosts() {
      return new Promise((resolve) => {
        try {
          const req = indexedDB.open('TrexFeedStorage', 1);
          req.onupgradeneeded = function(e) {
            e.target.result.createObjectStore('userPosts', { keyPath: 'id' });
          };
          req.onsuccess = function(e) {
            const db = e.target.result;
            const tx = db.transaction('userPosts', 'readonly');
            const getAll = tx.objectStore('userPosts').getAll();
            getAll.onsuccess = () => resolve(getAll.result || []);
            getAll.onerror = () => resolve([]);
          };
          req.onerror = () => resolve([]);
        } catch(e) {
          resolve([]);
        }
      });
    }

    async function loadUserPosts() {
      const container = document.getElementById('userCreatedPostsArea');
      if (!container) return;

      let customPosts = [];
      try {
        customPosts = JSON.parse(localStorage.getItem('feed_user_posts')) || [];
      } catch (e) {
        customPosts = [];
      }

      const dbPosts = await getIndexedDBPosts();
      if (dbPosts && dbPosts.length > 0) {
        const map = new Map();
        customPosts.forEach(p => map.set(p.id, p));
        dbPosts.forEach(p => map.set(p.id, p));
        customPosts = Array.from(map.values()).reverse();
      }

      container.innerHTML = '';

      customPosts.forEach(post => {
        postState[post.id] = {
          likes: post.likes || 0,
          dislikes: post.dislikes || 0,
          liked: false,
          disliked: false
        };

        const postEl = document.createElement('div');
        postEl.className = 'tweet-card';
        postEl.id = `post-${post.id}`;

        let mediaHTML = '';
        if (post.video) {
          mediaHTML = `
            <div class="tweet-media-wrap">
              <video src="${post.video}" controls playsinline preload="metadata"></video>
            </div>`;
        } else if (post.image) {
          mediaHTML = `
            <div class="tweet-media-wrap">
              <img src="${post.image}" alt="Post media">
            </div>`;
        }

        const bodyHTML = post.body ? `<div class="tweet-content-text">${escapeHtml(post.body)}</div>` : '';

        postEl.innerHTML = `
          <div class="tweet-left-avatar" style="background: #141418; border: 1px solid #262626; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #ffffff;">
            U
          </div>
          <div class="tweet-main-body">
            <div class="tweet-author-line">
              <div class="author-meta-names">
                <span class="author-name">${escapeHtml(post.author || 'You')}</span>
                <span class="author-handle">${escapeHtml(post.handle || '@you')}</span>
                <span class="tweet-time-dot">· ${post.time || 'Just now'}</span>
              </div>
              <button class="tweet-more-btn" onclick="showToast('Options')">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle><circle cx="5" cy="12" r="1.5"></circle></svg>
              </button>
            </div>
            
            <div class="tweet-post-title">${escapeHtml(post.title)}</div>
            ${bodyHTML}
            ${mediaHTML}

            <div class="x-action-bar">
              <!-- 1. Comment -->
              <button type="button" class="action-btn-item reply" onclick="handleReply('${post.id}')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
                <span id="commVal-${post.id}">0</span>

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

                  <polyline points="16 6 12 2 8 6"></polyline>
                  <line x1="12" y1="2" x2="12" y2="15"></line>
                </svg>
                <span>Share</span>
              </button>

              <!-- 3. Like -->
              <button type="button" class="action-btn-item like" id="likeBtn-${post.id}" onclick="handleLike('${post.id}')">

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Like Toggle (Mutually Exclusive, Comment Page Style)
    function handleLike(id) {
      const p = postState[id];
      if (!p) return;
      const likeBtn = document.getElementById(`likeBtn-${id}`);
      const likeVal = document.getElementById(`likeVal-${id}`);
      const dislikeBtn = document.getElementById(`dislikeBtn-${id}`);
      const dislikeVal = document.getElementById(`dislikeVal-${id}`);

      p.liked = !p.liked;
      p.likes += p.liked ? 1 : -1;

      if (p.liked && p.disliked) {
        p.disliked = false;
        p.dislikes = Math.max(0, p.dislikes - 1);
        if (dislikeBtn) dislikeBtn.classList.remove('active');
        if (dislikeVal) dislikeVal.innerText = p.dislikes;
      }

      if (likeBtn) likeBtn.classList.toggle('active', p.liked);
      if (likeVal) {
        if (id === 'monkey') {
          likeVal.innerText = p.liked ? '3,001' : '3K';
        } else if (id === 1) {
          likeVal.innerText = p.liked ? '4,821' : '4.8K';
        } else {
          likeVal.innerText = p.likes;
        }
      }
    }

    // Dislike Toggle (Mutually Exclusive, Comment Page Style)
    function handleDislike(id) {
      const p = postState[id];
      if (!p) return;
      const likeBtn = document.getElementById(`likeBtn-${id}`);
      const likeVal = document.getElementById(`likeVal-${id}`);
      const dislikeBtn = document.getElementById(`dislikeBtn-${id}`);
      const dislikeVal = document.getElementById(`dislikeVal-${id}`);

      p.disliked = !p.disliked;
      p.dislikes += p.disliked ? 1 : -1;

      if (p.disliked && p.liked) {
        p.liked = false;
        p.likes = Math.max(0, p.likes - 1);
        if (likeBtn) likeBtn.classList.remove('active');
        if (likeVal) {
          if (id === 'monkey') likeVal.innerText = '3K';
          else if (id === 1) likeVal.innerText = '4.8K';
          else likeVal.innerText = p.likes;
        }
      }

      if (dislikeBtn) dislikeBtn.classList.toggle('active', p.disliked);
      if (dislikeVal) dislikeVal.innerText = p.dislikes;
    }

    // Comment Click
    function handleReply(id) {
      window.location.href = 'view.html';
    }

    // Share Click
    function handleShare(title) {
      if (navigator.share) {
        navigator.share({ title: title, url: window.location.href }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href).then(() => {
          showToast('Link copied to clipboard');
        });
      }
    }

    function navigateRoot(path) {
      const clean = path.startsWith('/') ? path : '/' + path;
      if (window.location.protocol === 'file:') {
        window.location.href = '..' + clean;
      } else {
        window.location.href = window.location.origin + clean;
      }
    }

    let resolvedTaskPath = '/pages/Task.html';
    (function resolveTaskPath() {
      if (window.location.protocol === 'file:') return;
      ['\/pages\/Task.html', '\/pages\/task.html'].forEach(async p => {
        try {
          const r = await fetch(window.location.origin + p, { method: 'HEAD' });
          if (r.ok) resolvedTaskPath = p;
        } catch (e) {}
      });
    })();

    function selectNav(key) {
      if (key === 'feed') return;
      if (key === 'home') {
        navigateRoot('/index.html');
      } else if (key === 'games') {
        navigateRoot('/Games/Games.html');
      } else if (key === 'task') {
        navigateRoot(resolvedTaskPath);
      } else if (key === 'profile') {
        navigateRoot('/Profile/profile.html');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toastPill');
      toast.innerText = msg;
      toast.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    // Tap on card opens view.html
    document.getElementById('postsTimeline').addEventListener('click', function (e) {
      if (e.target.closest('.action-btn-item, .tweet-more-btn, a, video')) return;
      if (e.target.closest('.tweet-card')) {
        window.location.href = 'view.html';
      }
    });

    loadUserPosts();
    window.addEventListener('storage', loadUserPosts);
  </script>

</body>
  </html>
