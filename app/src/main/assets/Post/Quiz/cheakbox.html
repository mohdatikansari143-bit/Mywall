<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Create post</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background-color: #000000;
      min-height: 100vh;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
    }

    /* Top Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0 18px 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
      color: #f1f1f1;
    }

    .post-btn {
      background-color: #525252;
      color: #0f0f0f;
      border: none;
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: not-allowed;
      transition: background-color 0.2s, color 0.2s;
    }

    .post-btn.active {
      background-color: #ffffff;
      color: #000000;
      cursor: pointer;
    }

    /* Profile Section */
    .profile-section {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #0d0d0d;
      border: 1px solid #1f1f1f;
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .username {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }

    .public-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: #0d0d0d; /* Dark Black Background */
      color: #15803d;            /* Dark Green Text & Icon */
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      width: fit-content;
    }

    /* Question Input */
    .question-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      resize: none;
      margin-bottom: 14px;
      line-height: 1.4;
      min-height: 28px;
    }

    .question-input::placeholder {
      color: #8e8e8e;
      font-weight: 700;
    }

    /* Options List */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 12px;
    }

    .option-row {
      display: flex;
      align-items: center;
      border: 1px solid #242424;
      border-radius: 12px;
      padding: 6px 10px 6px 6px;
      gap: 8px;
      background-color: #000000;
    }

    .option-input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #0a0a0a;
      border-radius: 8px;
      padding: 10px 12px;
      min-height: 44px;
    }

    .option-preview {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      display: none;
    }

    .option-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
    }

    .option-input::placeholder {
      color: #8e8e8e;
      font-weight: 700;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }

    .icon-btn:active {
      background-color: #161616;
    }

    /* Add Option Button */
    .add-option-btn {
      width: 100%;
      background-color: #0e0e0e;
      color: #ffffff;
      border: 1px solid #1c1c1c;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, background-color 0.2s;
    }

    .add-option-btn:active:not(:disabled) {
      background-color: #171717;
    }

    .add-option-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .hidden-file-input {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <div class="header">
      <div class="header-left">
        <button class="close-btn" id="closeBtn" aria-label="Close">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <span class="header-title">Create post</span>
      </div>
      <button class="post-btn" id="postBtn">Post</button>
    </div>

    <!-- Profile Section -->
    <div class="profile-section">
      <img
        class="avatar"
        src="https://api.dicebear.com/9.x/adventurer/svg?seed=Suho&backgroundColor=1e1b4b"
        alt="Suho"
      />
      <div class="profile-info">
        <span class="username">Suho</span>
        <div class="public-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span>Public</span>
        </div>
      </div>
    </div>

    <!-- Question Input -->
    <textarea
      class="question-input"
      id="questionInput"
      rows="1"
      placeholder="Ask Question"
    ></textarea>

    <!-- Options Container -->
    <div class="options-list" id="optionsList"></div>

    <!-- Add Option Button -->
    <button class="add-option-btn" id="addOptionBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>Add option</span>
    </button>
  </div>

  <script type="module" src="/ts-dist/Post/Quiz/cheakbox.js"></script>
</body>
</html>
