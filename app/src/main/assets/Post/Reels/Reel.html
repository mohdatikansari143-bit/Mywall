<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>View - Reels</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-weight:800!important;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;overflow:hidden}
body{display:flex;justify-content:center}
.app{position:relative;width:100%;max-width:420px;height:100dvh;background:#000;overflow:hidden}

/* Dark liquid glass (kept for back & pause indicator) */
.glass{background:rgba(12,12,14,.72);backdrop-filter:blur(25px) saturate(200%);-webkit-backdrop-filter:blur(25px) saturate(200%);border:1px solid rgba(255,255,255,.08);border-top:1px solid rgba(255,255,255,.18);box-shadow:0 8px 30px rgba(0,0,0,.95),inset 0 1px 1.5px rgba(255,255,255,.12),inset 0 -1px 2px rgba(0,0,0,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .2s cubic-bezier(.2,.8,.2,1),background .2s;cursor:pointer}
.glass:active{transform:scale(.88);background:rgba(5,5,6,.95)}

.back{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:16px;width:44px;height:44px;z-index:30;transition:opacity .2s}

/* Fast Instagram Reels Snap Scroll */
.feed{
  height:100%;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  scrollbar-width:none;
}
.feed::-webkit-scrollbar{display:none}
.reel{
  position:relative;
  height:100dvh;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  overflow:hidden;
  background:#000;
}
.media{position:absolute;inset:0 0 28% 0;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:inset .25s ease}
.media img,.media video{width:100%;height:100%;object-fit:cover;pointer-events:none;transform:scale(1.04);transition:transform 6s ease-out}
.reel.active .media img,.reel.active .media video{transform:scale(1)}
.caption{position:absolute;left:0;right:0;top:44%;text-align:center;padding:0 60px 0 20px;font-size:24px;font-style:italic;font-weight:900!important;letter-spacing:-.5px;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 4px 12px #000;pointer-events:none;transition:opacity .2s}
.app.cc-off .caption{opacity:0}
.hit{position:absolute;inset:0;z-index:5}

/* Fullscreen mode */
.app.fs .media{inset:0}
.app.fs .rail,
.app.fs .bottom,
.app.fs .back,
.app.fs .hint{opacity:0;pointer-events:none}

/* Paused indicator */
.pause-ind{position:absolute;top:40%;left:50%;width:70px;height:70px;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:6;pointer-events:none;transition:all .25s}
.reel.paused .pause-ind{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* Side rail (no circle box, original size restored) */
.rail{position:absolute;right:14px;bottom:100px;display:flex;flex-direction:column;align-items:center;gap:15px;z-index:20;transition:opacity .2s}
.unit{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.pill{width:46px;height:46px;position:relative;display:flex;align-items:center;justify-content:center;transition:transform .2s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 2px 6px rgba(0,0,0,.9))}
.unit:active .pill{transform:scale(.88)}
.cnt{font-size:13px;margin-top:5px;text-shadow:0 2px 4px #000;font-weight:900!important}

/* Like Icon (Butterfly Heart) */
.heart-ico{width:24px;height:24px;fill:currentColor;color:#fff;overflow:visible;transition:color .2s,transform .2s;flex-shrink:0}
.unit.liked .heart-ico{color:#ff5fa2;fill:#ff5fa2;filter:drop-shadow(0 0 10px rgba(255,95,162,.7));animation:beat .45s cubic-bezier(.3,1.6,.5,1)}
.unit.liked .cnt{color:#ff5fa2}
@keyframes beat{0%{transform:scale(.6)}60%{transform:scale(1.35)}100%{transform:scale(1)}}

/* Dislike Icon (F*** You Typography & Custom Pop Animation) */
.dis-ico{width:23px;height:23px;fill:currentColor;color:#fff;overflow:visible;transition:color .2s,transform .2s;flex-shrink:0}
.unit.disliked .dis-ico{
  color:#ff5fa2;
  fill:#ff5fa2;
  filter:drop-shadow(0 0 12px rgba(255,95,162,.8));
  animation:dislikePop .45s cubic-bezier(.175,.885,.32,1.275);
}
.unit.disliked .cnt{color:#ff5fa2}

@keyframes dislikePop{
  0%{transform:scale(.6) translateY(4px)}
  45%{transform:scale(1.4) translateY(-6px) rotate(-10deg)}
  75%{transform:scale(.95) translateY(0) rotate(5deg)}
  100%{transform:scale(1) translateY(0) rotate(0)}
}

/* Floating Middle Finger Dislike Burst */
.dislike-float-burst{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ff5fa2;
  pointer-events:none;
  z-index:10;
  animation:disFloat .65s cubic-bezier(.2,.9,.3,1.2) forwards;
}
.dislike-float-burst svg{
  width:32px;
  height:32px;
  fill:currentColor;
  filter:drop-shadow(0 0 10px rgba(255,95,162,0.9));
}
@keyframes disFloat{
  0%{transform:scale(0.5) translateY(0);opacity:1}
  50%{transform:scale(1.35) translateY(-30px);opacity:1}
  100%{transform:scale(1.6) translateY(-52px);opacity:0}
}

/* Ring bursts */
.ring, .dis-ring{position:absolute;inset:0;border-radius:50%;border:2px solid #ff5fa2;opacity:0;pointer-events:none}
.unit.liked .ring{animation:ring .55s ease-out}
.unit.disliked .dis-ring{animation:ring .55s ease-out}
@keyframes ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(2);opacity:0}}

/* Big double-tap burst */
.burst{position:absolute;width:0;height:0;z-index:40;pointer-events:none}
.big{position:absolute;left:-60px;top:-60px;width:120px;height:120px;filter:drop-shadow(0 0 22px rgba(255,60,140,.9));animation:bigpop .9s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes bigpop{0%{transform:scale(0) rotate(-25deg);opacity:0}25%{transform:scale(1.25) rotate(8deg);opacity:1}45%{transform:scale(.95) rotate(-3deg)}65%{transform:scale(1.05) rotate(0)}100%{transform:scale(1.5) translateY(-60px);opacity:0}}
.shock{position:absolute;left:-50px;top:-50px;width:100px;height:100px;border-radius:50%;border:3px solid rgba(255,95,162,.9);animation:shock .7s ease-out forwards}
@keyframes shock{0%{transform:scale(.3);opacity:1}100%{transform:scale(3.2);opacity:0}}
.mini{position:absolute;left:-9px;top:-9px;width:18px;height:18px;animation:fly var(--d) cubic-bezier(.1,.7,.3,1) forwards;opacity:0}
@keyframes fly{0%{transform:translate(0,0) scale(.2) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(var(--s)) rotate(var(--r));opacity:0}}
.spark{position:absolute;left:-2px;top:-2px;width:5px;height:5px;border-radius:50%;background:#ffe27a;box-shadow:0 0 8px #ffd34d;animation:fly .8s ease-out forwards;opacity:0}

/* Bottom panel */
.bottom{position:absolute;left:0;right:0;bottom:0;z-index:15;padding:20px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,#000 72%,rgba(0,0,0,.85) 90%,transparent);pointer-events:none;transition:opacity .2s}
.bottom>*{pointer-events:auto}
.profile{display:flex;align-items:center;margin-bottom:14px;max-width:75%}
.profile img{width:44px;height:44px;border-radius:50%;object-fit:cover;margin-right:12px;border:1.5px solid rgba(255,255,255,.2)}
.dn{font-size:17px;letter-spacing:-.3px;display:block}
.hn{font-size:14px;color:#71767b;margin-top:1px;display:block}
.bar{width:100%;height:3px;background:rgba(255,255,255,.2);border-radius:2px;margin-bottom:12px;overflow:hidden}
.fill{width:0;height:100%;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.8)}
.ctrl{display:flex;align-items:center;justify-content:space-between}
.grp{display:flex;align-items:center;gap:16px}
.time{font-size:13px;color:#71767b}
.spd{font-size:14px}
.grp svg{cursor:pointer}

/* Swipe hint */
.hint{position:absolute;bottom:calc(150px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:12;font-size:12px;color:#aaa;animation:hint 1.6s ease-in-out 3;opacity:0;pointer-events:none;transition:opacity .2s}
@keyframes hint{0%,100%{opacity:0;transform:translate(-50%,10px)}50%{opacity:1;transform:translate(-50%,-4px)}}

/* Scrim (pure dark) */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.78);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.scrim.show{opacity:1;pointer-events:auto}

/* Post Action Menu Sheet (Long Press - Pure Dark) */
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:61;
  padding:10px 12px calc(22px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,#08080a 0%,#000000 100%);
  border:1px solid rgba(255,255,255,.08);
  border-top:1px solid rgba(255,255,255,.15);
  border-radius:26px 26px 0 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.98),inset 0 1px 1.5px rgba(255,255,255,.08);
  transform:translateY(100%);
  pointer-events:none;
  transition:transform .28s cubic-bezier(.2,.9,.3,1);
}
.sheet.show{
  transform:translateY(0);
  pointer-events:auto;
}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto 10px}
.sheet-item{display:flex;align-items:center;gap:22px;padding:16px 18px;border-radius:16px;font-size:19px;cursor:pointer;transition:background .15s,transform .15s}
.sheet-item:active{background:rgba(255,255,255,.07);transform:scale(.98)}
.sheet-item svg{flex-shrink:0}

/* 3-Line Menu Sheet (View fullscreen / Speed / Auto scroll / CC - Pure Dark) */
.lp-sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:63;
  padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,#08080a 0%,#000000 100%);
  border:1px solid rgba(255,255,255,.08);
  border-top:1px solid rgba(255,255,255,.15);
  border-radius:26px 26px 0 0;
  box-shadow:0 -14px 45px rgba(0,0,0,1),inset 0 1px 1.5px rgba(255,255,255,.08);
  transform:translateY(100%);
  pointer-events:none;
  transition:transform .28s cubic-bezier(.2,.9,.3,1);
}
.lp-sheet.show{
  transform:translateY(0);
  pointer-events:auto;
}
.lp-row{
  display:flex;align-items:center;gap:18px;
  padding:14px 6px;border-radius:14px;
  font-size:17px;color:#fff;cursor:pointer;
  transition:background .15s;
}
.lp-row:active{background:rgba(255,255,255,.05)}
.lp-row svg{flex-shrink:0;width:24px;height:24px}
.lp-label{flex:1}

/* Speed selector pills */
.spd-group{
  display:flex;align-items:center;
  background:#121216;
  border:1px solid rgba(255,255,255,.08);
  border-radius:999px;
  padding:3px;
  gap:2px;
}
.spd-btn{
  padding:7px 12px;
  border-radius:999px;
  font-size:13.5px;
  color:#8a8d93;
  cursor:pointer;
  transition:all .18s ease;
}
.spd-btn.active{
  background:#000;
  color:#fff;
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 2px 10px rgba(0,0,0,.9);
}

/* Auto scroll toggle */
.toggle-sw{
  width:48px;height:28px;border-radius:999px;
  background:#141418;
  border:1.5px solid rgba(255,255,255,.24);
  position:relative;cursor:pointer;
  transition:all .2s ease;
  flex-shrink:0;
}
.toggle-sw::after{
  content:'';position:absolute;top:3px;left:3px;
  width:19px;height:19px;border-radius:50%;
  background:#6e7178;transition:all .2s ease;
}
.toggle-sw.on{
  background:#fff;border-color:#fff;
}
.toggle-sw.on::after{
  transform:translateX(20px);
  background:#000;
}

/* Share Sheet */
.share-sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:62;
  height:340px;border-radius:28px 28px 0 0;
  overflow:hidden;background:#000;
  box-shadow:0 -12px 40px rgba(0,0,0,.95);
  transform:translateY(100%);
  pointer-events:none;
  transition:transform .28s cubic-bezier(.2,.9,.3,1);
}
.share-sheet.show{
  transform:translateY(0);
  pointer-events:auto;
}
.share-sheet iframe{width:100%;height:100%;border:0;display:block;background:#000}

/* Full Comment Sheet (Slides in from Right ⬅️) */
.comment-sheet{
  position:absolute;inset:0;z-index:65;height:100dvh;width:100%;
  overflow:hidden;background:#000;
  box-shadow:-12px 0 35px rgba(0,0,0,.95);
  transform:translateX(100%);
  opacity:0;
  pointer-events:none;
  transition:transform .3s cubic-bezier(.2,.9,.3,1),opacity .24s ease;
}
.comment-sheet.show{
  transform:translateX(0);
  opacity:1;
  pointer-events:auto;
}
.comment-sheet iframe{width:100%;height:100%;border:0;display:block;background:#000}

.toast{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);padding:10px 18px;border-radius:9999px;background:rgba(6,6,8,.96);border:1px solid rgba(255,255,255,.12);font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:70;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="glass back" title="Back" onclick="location.href='feed.html'">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
  </div>
  <div class="feed" id="feed"></div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <div class="sheet-item" data-act="report"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span>Report</span></div>
    <div class="sheet-item" data-act="suggested"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c.6 5.2 4.8 9.4 10 10-5.2.6-9.4 4.8-10 10-.6-5.2-4.8-9.4-10-10 5.2-.6 9.4-4.8 10-10z"/></svg><span>Suggested</span></div>
    <div class="sheet-item" data-act="download"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg><span>Download</span></div>
    <div class="sheet-item" data-act="repost"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg><span>Repost</span></div>
    <div class="sheet-item" data-act="copy"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span>Copy link</span></div>
  </div>

  <!-- 3-Line Bottom Menu -->
  <div class="lp-sheet" id="lpSheet">
    <div class="grab"></div>
    <div class="lp-row" id="lpFullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9V5a1 1 0 0 1 1-1h4"/><path d="M15 4h4a1 1 0 0 1 1 1v4"/><path d="M20 15v4a1 1 0 0 1-1 1h-4"/><path d="M9 20H5a1 1 0 0 1-1-1v-4"/>
      </svg>
      <span class="lp-label" id="lpFsText">View fullscreen</span>
    </div>

    <div class="lp-row" style="cursor:default">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 12l-3.5-3.5"/><circle cx="12" cy="12" r="9"/><path d="M12 3v2"/>
      </svg>
      <span class="lp-label">Speed</span>
      <div class="spd-group" id="spdGroup">
        <div class="spd-btn" data-spd="0.5">.5x</div>
        <div class="spd-btn active" data-spd="1">1x</div>
        <div class="spd-btn" data-spd="1.5">1.5x</div>
        <div class="spd-btn" data-spd="2">2x</div>
      </div>
    </div>

    <div class="lp-row" id="lpAutoScroll">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><polyline points="21 3 21 8 16 8"/><polygon points="10 9 15 12 10 15 10 9" fill="#fff" stroke="none"/>
      </svg>
      <span class="lp-label">Auto scroll</span>
      <div class="toggle-sw" id="autoScrollSw"></div>
    </div>

    <div class="lp-row" id="lpCaptions">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10.5 10.2a2 2 0 1 0 0 3.6"/><path d="M16.5 10.2a2 2 0 1 0 0 3.6"/>
      </svg>
      <span class="lp-label" id="lpCcText">Closed Captions</span>
    </div>
  </div>

  <!-- Share sheet: loads share.html -->
  <div class="share-sheet" id="shareSheet"><iframe id="shareFrame" title="Share to"></iframe></div>

  <!-- Full Comment sheet: loads comment.html -->
  <div class="comment-sheet" id="commentSheet"><iframe id="commentFrame" title="Comments"></iframe></div>

  <div class="toast" id="toast"></div>
</div>

<script type="module" src="/ts-dist/Post/Reels/Reel.js"></script>
</body>
        </html>
