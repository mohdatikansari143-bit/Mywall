<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>GIFs</title>

<style>
:root{
 --bg:#000;
 --panel:#121212;
 --line:rgba(255,255,255,.09);
 --muted:#8a8a90;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{
 color:#fff;min-height:100vh;
 font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Arial,sans-serif;
 -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Header ---------- */
header{
 position:sticky;top:0;z-index:20;
 padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
 background:#000;
 border-bottom:1px solid rgba(255,255,255,.05);
}
.wrap{max-width:1100px;margin:0 auto}
.row{display:flex;align-items:center;gap:10px}

/* --- BACK BUTTON (Solid Dark & Bold) --- */
.back{
 width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;
 background:#121212;
 border:1px solid rgba(255,255,255,0.12);
 transition:transform .15s ease, background .2s ease, border-color .2s ease;
}
.back:active{
 transform:scale(0.94);
 background:#1e1e20;
 border-color:rgba(255,255,255,0.22);
}
.back svg{width:20px;height:20px;color:#fff;stroke-width:2.8}

/* --- SEARCH BAR (Slim + White Strip Border) --- */
.search{
 flex:1;min-width:0;height:38px;display:flex;align-items:center;gap:8px;
 padding:0 6px 0 14px;border-radius:9999px;
 background:var(--panel);border:1.5px solid #ffffff;
}
.search:focus-within{border-color:#ffffff}
.search svg{color:var(--muted);width:18px;height:18px}
.search input{
 flex:1;min-width:0;background:transparent;border:0;outline:0;
 color:#fff;font-size:16px;font-weight:500;
}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
#clearBtn{
 width:26px;height:26px;border-radius:50%;display:none;place-items:center;background:#262626;
}
#clearBtn.show{display:grid}
#clearBtn svg{width:13px;height:13px}

/* --- TABS --- */
.tabs{display:flex;gap:10px;margin-top:12px}
.tab{
 flex:1;height:44px;border-radius:9999px;font-size:14px;font-weight:800;letter-spacing:1px;
 text-transform:uppercase;color:rgba(255,255,255,.45);
 background:transparent;border:2px solid rgba(255,255,255,.18);
 transition:border-color .2s, color .2s, background .2s;
}
.tab:active{opacity:.85}
.tab.active{
 background:rgba(255,255,255,.06);color:#fff;border-color:#ffffff;
}

.recent{display:none;margin-top:10px}
.recent.show{display:block}
.recent-head{display:flex;justify-content:space-between;margin-bottom:8px}
.recent-head span{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.recent-head button{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
 flex:none;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
 background:var(--panel);border:1px solid var(--line);
}

/* ---------- Content ---------- */
main{padding:6px 4px calc(36px + env(safe-area-inset-bottom))}
.heading{font-size:16px;font-weight:800;padding:10px 6px;word-break:break-word}
.heading:empty{display:none}

.masonry{display:flex;gap:4px;align-items:flex-start}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}

.card{
 width:100%;overflow:hidden;border-radius:12px;background:var(--panel);cursor:pointer;
 contain:layout paint;
}
.card:active{opacity:.8}
.card img{width:100%;height:100%;display:block;object-fit:cover;opacity:0;transition:opacity .3s}
.card img.ready{opacity:1}
.stickers .card img{object-fit:contain;padding:8px}

.sk{width:100%;border-radius:12px;background:var(--panel);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}

/* ---------- States ---------- */
.state{text-align:center;padding:70px 24px;color:var(--muted)}
.orb{
 width:68px;height:68px;margin:0 auto 16px;border-radius:22px;display:grid;place-items:center;
 background:var(--panel);border:1px solid var(--line);
}
.orb svg{width:28px;height:28px;color:#fff}
.state h3{color:#fff;font-size:18px;margin-bottom:6px}
.state p{font-size:14px;line-height:1.5}
.state button{margin-top:18px;padding:12px 26px;border-radius:14px;background:#fff;color:#000;font-weight:700}
#sentinel{height:1px}
#end{text-align:center;color:var(--muted);font-size:13px;padding:20px 0 4px}
.credit{text-align:center;padding:16px;color:#5f5f64;font-size:12px}
.credit a{color:#8a8a90;text-decoration:none}

/* ---------- Preview ---------- */
.modal{
 position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;
 background:#000;
}
.modal.show{display:flex}
.m-top{width:100%;display:flex;justify-content:flex-end;padding:calc(10px + env(safe-area-inset-top)) 12px 0}
.m-top button{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--panel)}
.stage{flex:1;width:100%;min-height:0;display:grid;place-items:center;padding:14px}
.stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:16px}
.m-bar{display:flex;gap:10px;width:100%;max-width:440px;padding:0 16px calc(18px + env(safe-area-inset-bottom))}
.pill{
 flex:1;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;
 font-weight:700;font-size:15px;background:var(--panel);border:1px solid var(--line);
}
.pill.primary{background:#fff;color:#000;border-color:#fff}
.pill:active{opacity:.8}

.toast{
 position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));z-index:60;
 transform:translateX(-50%);opacity:0;pointer-events:none;
 padding:10px 18px;border-radius:14px;font-size:13px;font-weight:600;
 background:#1c1c1c;border:1px solid var(--line);transition:opacity .25s;
}
.toast.show{opacity:1}

@media(min-width:700px){
 header,main{padding-left:20px;padding-right:20px}
 .masonry,.col{gap:8px}
}
</style>
</head>

<body>

<header>
 <div class="wrap">
  <div class="row">
   <button class="back" id="backBtn" aria-label="Back">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M11 5l-7 7 7 7"/></svg>
   </button>
   <form class="search" id="searchForm" autocomplete="off">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="searchInput" type="search" maxlength="50" placeholder="Search for GIFs" enterkeyhint="search">
    <button type="button" id="clearBtn" aria-label="Clear">
     <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
   </form>
  </div>

  <div class="recent" id="recent">
   <div class="recent-head"><span>Recent</span><button type="button" id="clearHistory">Clear</button></div>
   <div class="chips" id="chips"></div>
  </div>

  <div class="tabs">
   <button class="tab active" data-type="gifs">GIFs</button>
   <button class="tab" data-type="stickers">Stickers</button>
  </div>
 </div>
</header>

<main>
 <div class="wrap">
  <div class="heading" id="heading"></div>
  <div class="masonry" id="gallery"></div>
  <div id="stateBox"></div>
  <div id="sentinel"></div>
  <div id="end" hidden>You've reached the end</div>
  <div class="credit">Powered by <a href="https://giphy.com" target="_blank" rel="noopener">GIPHY</a></div>
 </div>
</main>

<!-- Full-screen preview -->
<div class="modal" id="modal">
 <div class="m-top">
  <button id="closeModal" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
 </div>
 <div class="stage"><img id="preview" alt=""></div>
 <div class="m-bar">
  <button class="pill primary" id="dlBtn">Download</button>
  <button class="pill" id="shareBtn">Share</button>
 </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="/ts-dist/Post/Reels/gif.js"></script>
</body>
</html>
