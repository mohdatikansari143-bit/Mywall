<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Tap</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.16);--muted:#a0a0a0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;background:#000;overscroll-behavior:none}
body{color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:700;overflow:hidden;touch-action:manipulation}
b,h2{font-weight:800}
.app{position:relative;height:100%;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 12px)}

header{display:flex;align-items:center;justify-content:space-between}
.btn{height:44px;border-radius:16px;border:1px solid var(--line);background:var(--glass);color:#fff;cursor:pointer;display:flex;align-items:center;gap:8px;padding:0 12px;font:inherit;transition:transform .1s}
.btn:active{transform:scale(.94)}
.circle{width:44px;padding:0;justify-content:center;border-radius:50%}
.chip{padding:0 16px 0 6px;border-radius:99px;height:46px}
.who{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;text-align:left}
.who b{font-size:13px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{font-size:11px;color:var(--muted)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#fff,#bdbdbd);color:#000;font-weight:800;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}

.balance{text-align:center;margin-top:14px}
.lbl{color:var(--muted);font-size:12px;letter-spacing:1.5px;text-transform:uppercase}
.amount{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:2px}
.amount img{width:40px;height:40px;object-fit:contain;pointer-events:none}
#balance{font-size:clamp(36px,12vw,52px);font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
#balance.bump{animation:bump .15s}
@keyframes bump{50%{transform:scale(1.05)}}
.pill{display:inline-block;margin-top:6px;padding:4px 14px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:13px}

.stage{flex:1;min-height:0;display:grid;place-items:center;position:relative;margin-top:-2vh}
.glow{position:absolute;width:min(92vw,420px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 65%);filter:blur(18px);pointer-events:none;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1);opacity:.7}}
.idle{animation:idle 4s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-8px)}}
.coin{width:min(74vw,330px,44vh);aspect-ratio:1;cursor:pointer;touch-action:none;position:relative;
  transform:perspective(650px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--s,1));
  transition:transform .14s cubic-bezier(.2,.8,.3,1);will-change:transform;filter:drop-shadow(0 20px 32px rgba(0,0,0,.8))}
.coin.press{--s:.93}
.coin img{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.coin.fallback{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc83d 45%,#c57a00);box-shadow:inset 0 0 0 10px rgba(255,255,255,.18),inset 0 0 40px rgba(0,0,0,.25)}
.coin.fallback img{display:none}

.dock{padding:12px 14px;border-radius:20px;background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;font-size:13px}
.row .r{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.bar.thin{height:6px}
.bar div{height:100%;width:0;border-radius:99px;background:#fff;transition:width .25s linear}
.energy{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.energy.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn.sm{height:30px;padding:0 12px;border-radius:99px;font-size:12px}
.btn:disabled{opacity:.35}

#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.float{position:absolute;font-weight:800;font-size:26px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.8);transform:translate(-50%,-50%);animation:up .9s ease-out forwards}
@keyframes up{to{transform:translate(-50%,-150px);opacity:0}}
.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translate(-50%,-20px);opacity:0;z-index:90;padding:10px 18px;border-radius:99px;background:#111;border:1px solid #fff;font-weight:800;font-size:14px;transition:.3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}

.sheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.open{opacity:1;pointer-events:auto}
.panel{width:100%;max-width:520px;max-height:88%;overflow:auto;background:#0a0a0a;border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.3,1);text-align:center}
.sheet.open .panel{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 16px}
.panel .avatar{width:76px;height:76px;font-size:32px;margin:0 auto 10px}
.panel h2{margin:0;font-size:21px}
.panel p{margin:4px 0 16px;color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:12px;border-radius:16px;background:var(--glass);border:1px solid var(--line);text-align:left}
.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px}
.stat b{font-size:16px;font-variant-numeric:tabular-nums;word-break:break-all}
.span2{grid-column:span 2}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="btn circle" id="backBtn" aria-label="Back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="btn chip" id="profileBtn" aria-label="Profile">
      <span class="avatar" data-avatar>P</span>
      <span class="who"><b id="chipName">Player</b><small id="chipId">ID: —</small></span>
    </button>
  </header>

  <section class="balance">
    <div class="lbl">Balance</div>
    <div class="amount"><img data-coin alt=""><span id="balance">0.00</span></div>
    <div class="pill">+<span id="perTap">0.60</span> / tap</div>
  </section>

  <main class="stage">
    <div class="glow"></div>
    <div class="idle"><div class="coin" id="coin"><img data-coin alt="Coin" draggable="false"></div></div>
  </main>

  <footer class="dock">
    <div class="row"><span id="lvName"></span><span class="r" id="lvLeft"></span></div>
    <div class="bar thin"><div id="lvBar"></div></div>
    <div class="energy" id="energy">
      <div class="row">
        <span>⚡ <span id="energyTxt"></span></span>
        <button class="btn sm" id="boost"><span id="boostTxt"></span></button>
      </div>
      <div class="bar"><div id="energyFill" style="width:100%"></div></div>
    </div>
  </footer>
</div>

<div id="fx"></div>
<div id="toast"></div>

<div class="sheet" id="sheet">
  <div class="panel">
    <div class="grab"></div>
    <span class="avatar" data-avatar>P</span>
    <h2 id="pName">Player</h2>
    <p id="pUser"></p>
    <div class="stats">
      <div class="stat span2" id="idStat"><small>Telegram ID (tap to copy)</small><b id="sId">—</b></div>
      <div class="stat"><small>Total earned</small><b id="sEarn"></b></div>
      <div class="stat"><small>Total taps</small><b id="sTaps"></b></div>
      <div class="stat"><small>Per tap</small><b id="sPer"></b></div>
      <div class="stat"><small>Level</small><b id="sLv"></b></div>
      <div class="stat span2"><small>Playing since</small><b id="sSince"></b></div>
    </div>
  </div>
</div>

<script type="module" src="/ts-dist/pages/Tap.js"></script>
</body>
  </html>
